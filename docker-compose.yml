name: event-discovery

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
  environment: &airflow-common-environment
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://${AIRFLOW_HOST}:${AIRFLOW_PORT}/execution/
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${AIRFLOW_DB}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    EVENT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    EVENTBRITE_API_BASE_URL: ${EVENTBRITE_API_BASE_URL}
    EVENTBRITE_API_TOKEN: ${EVENTBRITE_API_TOKEN}
    EVENTBRITE_DAG_SCHEDULE: ${EVENTBRITE_DAG_SCHEDULE}
    EVENTBRITE_DETAIL_CACHE_TTL_HOURS: ${EVENTBRITE_DETAIL_CACHE_TTL_HOURS:-24}
    EVENTBRITE_REQUEST_TIMEOUT_SECONDS: ${EVENTBRITE_REQUEST_TIMEOUT_SECONDS:-30}
    EVENTBRITE_WEB_BASE_URL: ${EVENTBRITE_WEB_BASE_URL:-https://www.eventbrite.com}
    GOOGLE_GEOCODING_API_BASE_URL: ${GOOGLE_GEOCODING_API_BASE_URL}
    GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY}
    GOOGLE_GEOCODING_DAG_SCHEDULE: ${GOOGLE_GEOCODING_DAG_SCHEDULE}
    GOOGLE_GEOCODING_LANGUAGE_CODE: ${GOOGLE_GEOCODING_LANGUAGE_CODE}
    GOOGLE_GEOCODING_REGION_CODE: ${GOOGLE_GEOCODING_REGION_CODE}
    GOOGLE_GEOCODING_TIMEOUT_SECONDS: ${GOOGLE_GEOCODING_TIMEOUT_SECONDS:-10}
  volumes:
    - airflow_logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS}:${POSTGRES_EXTERNAL_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --username $$POSTGRES_USER --dbname $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  airflow-db-init:
    image: postgres:16-alpine
    environment:
      AIRFLOW_DB: ${AIRFLOW_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
    command:
      - /bin/sh
      - -c
      - |
        case "$${AIRFLOW_DB}" in
          *[!a-zA-Z0-9_]*) echo "AIRFLOW_DB must contain only letters, digits, and underscores" >&2; exit 2 ;;
        esac
        if [ "$$(psql --host "$${POSTGRES_HOST}" --port "$${POSTGRES_PORT}" --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = '$${AIRFLOW_DB}'")" != "1" ]; then
          createdb --host "$${POSTGRES_HOST}" --port "$${POSTGRES_PORT}" --username "$${POSTGRES_USER}" "$${AIRFLOW_DB}"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "true"
    command: version
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_BIND_ADDRESS}:${AIRFLOW_EXTERNAL_PORT}:${AIRFLOW_PORT}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:${AIRFLOW_PORT}/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  api:
    build:
      context: ./api
    environment:
      API_DB_STARTUP_ATTEMPTS: ${API_DB_STARTUP_ATTEMPTS:-30}
      API_DB_STARTUP_RETRY_SECONDS: ${API_DB_STARTUP_RETRY_SECONDS:-1}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SEED_DATABASE: ${SEED_DATABASE}
    command:
      - uvicorn
      - app.main:app
      - --host
      - ${API_HOST}
      - --port
      - ${API_PORT}
    ports:
      - "${API_BIND_ADDRESS}:${API_EXTERNAL_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['API_PORT']}/health\", timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      VITE_GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID}
      VITE_PROXY_API_TARGET: ${VITE_PROXY_API_TARGET}
      WEB_HOST: ${WEB_HOST}
      WEB_PORT: ${WEB_PORT}
    command:
      - npm
      - run
      - preview
      - --
      - --host
      - ${WEB_HOST}
      - --port
      - ${WEB_PORT}
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_EXTERNAL_PORT}:${WEB_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:${WEB_PORT}/`).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  airflow_logs: {}
  pgdata: {}
