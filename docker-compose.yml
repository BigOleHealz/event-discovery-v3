name: event-discovery

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS}:${POSTGRES_EXTERNAL_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SEED_DATABASE: ${SEED_DATABASE}
    command:
      - uvicorn
      - app.main:app
      - --host
      - ${API_HOST}
      - --port
      - ${API_PORT}
    ports:
      - "${API_BIND_ADDRESS}:${API_EXTERNAL_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['API_PORT']}/health\", timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      VITE_GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID}
      WEB_HOST: ${WEB_HOST}
      WEB_PORT: ${WEB_PORT}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - ${WEB_HOST}
      - --port
      - ${WEB_PORT}
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_EXTERNAL_PORT}:${WEB_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:${WEB_PORT}/`).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata: {}
