gridphilly.com/wp-content/uploads/2026/03/General-Event-Banner-Move-r0DPjf.png","url":"https://gridphilly.com/event/move-with-me-13/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T06:00:00-04:00","endDate":"2026-09-30T08:00:00-04:00","location":{"@type":"Place","name":"Tacony Creek Park, Philadelphia, PA, United States","description":"","url":"https://gridphilly.com/venue/tacony-creek-park-philadelphia-pa-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Hike Cobbs Creek!","description":"&lt;p&gt;Come hike the less-travelled parts of Cobbs Creek! See details for dates and locationsHike Cobbs CreekYou may have walked near the Environmental Center, but what about the rest of Cobbs Creek? Join us for a series of hikes where we explore the less-frequented areas of the park, with a new location every week!Wednesdays 10am - 11amSeptember 9th: Mount Moriah Cemetery \u2013 Meet at 60th &amp; Warrington Haddington Woods \u2013 Meet at N Daggett &amp; VineSeptember 30th: Morris Park \u2013 Meet at 66th &amp; Sherwood&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/5fd9e44c9434904ecaae334acbd20608.jpg","url":"https://gridphilly.com/event/hike-cobbs-creek-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T10:00:00-04:00","endDate":"2026-09-30T11:00:00-04:00","organizer":{"@type":"Person","name":"Cobbs Creek Community Environmental Center","description":"","url":"https://www.facebook.com/CobbsEnvCenter/","telephone":"","email":"","sameAs":"https://www.facebook.com/CobbsEnvCenter/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tusculum Garden Guided Gardening Hours","description":"","url":"https://gridphilly.com/event/tusculum-garden-guided-gardening-hours/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T10:00:00-04:00","endDate":"2026-09-30T11:00:00-04:00","location":{"@type":"Place","name":"Tusculum Gateway Garden, 2715 Kensington Avenue, Philadelphia, PA, 19134","description":"","url":"https://gridphilly.com/venue/tusculum-gateway-garden-2715-kensington-avenue-philadelphia-pa-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Exploring our Native Oaks: Online","description":"&lt;p&gt;Discover the extraordinary life cycle, beauty, and ecological power of our region\u2019s native oaks\u2014from a tiny acorn to an ancient canopy. Learn everything you need to know about integrating native oaks into your landscape, including which species thrive in different soil types and moisture levels across the eastern temperate forest, including adaptable oaks that flourish almost anywhere. Virtual class ends at 2:15, as the instructor takes the in-person students for a tour of the gardens. All virtual registrants will receive a recording of the class with access to view the class for 30 days after the live session. This program&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Oak-meadow-scaled-6fYItq.jpg","url":"https://gridphilly.com/event/exploring-our-native-oaks-online/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T13:00:00-04:00","endDate":"2026-09-30T14:15:00-04:00","location":{"@type":"Place","name":"Mt Cuba","description":"","url":"https://gridphilly.com/venue/mt-cuba/","address":{"@type":"PostalAddress","streetAddress":"3120 Barley Mill Rd","addressLocality":"Hockessin","addressRegion":"DE","postalCode":"19707","addressCountry":"United States"},"telephone":"","sameAs":"https://mtcubacenter.org/venue/mt-cuba/"},"offers":{"@type":"Offer","price":"25","priceCurrency":"USD","url":"https://gridphilly.com/event/exploring-our-native-oaks-online/","category":"primary","availability":"inStock","validFrom":"2026-09-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"TASTING AS MINDFULNESS","description":"&lt;p&gt;Slow down and experience flavor with intention during this unique collaborative tasting led by Becky of The Random Tea Room and Nick from Parentheses. This immersive evening is designed to help you explore taste through curiosity rather than expertise. You\\'ll discover how aroma, texture, acidity, bitterness, sweetness, and umami work together to create memorable drinking experiences and why you already have everything you need to appreciate them. The evening includes two guided four course tastings for a total of eight unforgettable flavors. Each guest will also receive a bottle of Parentheses After to take home. Whether you\\'re a tea enthusiast,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/finalmindfull.png","url":"https://gridphilly.com/event/tasting-as-mindfulness/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T17:30:00-04:00","endDate":"2026-09-30T19:30:00-04:00","location":{"@type":"Place","name":"The Random Tea Room","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"713 N 4th Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"267-639-2442","sameAs":"https://www.therandomtearoom.com/event/sessions-with-the-muse/"},"organizer":{"@type":"Person","name":"The Random Tea Room","description":"","url":"https://www.therandomtearoom.com","telephone":"267-639-2442","email":"&#98;ecky&#64;&#116;he&#114;and&#111;mte&#97;&#114;&#111;o&#109;&#46;&#99;&#111;&#109;","sameAs":"https://www.therandomtearoom.com"},"offers":{"@type":"Offer","price":"85.00","priceCurrency":"USD","url":"https://gridphilly.com/event/tasting-as-mindfulness/","category":"primary","availability":"inStock","validFrom":"2026-08-10T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Coming of Age in the Affordability Crisis","description":"&lt;p&gt;A documentary screening and discussion about affordability, third spaces, and the climate crisis in partnership with Fab Youth Philly and Temple University Community Collaborative in partnership with the Sunrise Movement. \u00a0 This workshop is part of a series of events and workshops called A People\u2019s Exposition that is taking a critical and honest look at key issues shaping Philadelphia today, envisioning a more just and equitable future for our city, and acting on co-created solutions that address our greatest challenges. \u00a0&lt;/p&gt;\\n","url":"https://gridphilly.com/event/coming-of-age-in-the-affordability-crisis/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T17:30:00-04:00","endDate":"2026-09-30T19:30:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Earth Talk: Monarch Butterflies and the Miracle of Migration with author Mike Weilbacher","description":"&lt;p&gt;Writer-naturalist Mike Weilbacher will share the butterfly\\'s unique story, weaving up-to-date science on the creature\u2019s status with folk legend and even Aztec myth. You\u2019ll gain a new appreciation for this king of butterflies, and learn innumerable ways you can help this incredible animal. The author of \u201cWild Philly: Explore the Amazing Nature In and Around Philadelphia,\u201d Mike travels the region offering lectures and walks on everything from climate change in Philadelphia to microplastics to the healing power of nature. His programs have reached more than 3,000 people in just the last three years. Capricorn Bookshop will be selling &quot;Wild Philly\u201d&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Monarch-Migration-Talk-September-2026.png","url":"https://gridphilly.com/event/earth-talk-monarch-butterflies-and-the-miracle-of-migration-with-author-mike-weilbacher/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T19:00:00-04:00","endDate":"2026-09-30T20:00:00-04:00","location":{"@type":"Place","name":"abington township public library","description":"","url":"https://gridphilly.com/venue/abington-township-public-library/","address":{"@type":"PostalAddress","streetAddress":"1030 Old York Road","addressLocality":"Abington","postalCode":"19001","addressCountry":"United States"},"telephone":"215-885-5180","sameAs":"https://www.abingtonfreelibrary.org/"},"organizer":{"@type":"Person","name":"Abington Township Public Library","description":"","url":"https://www.abingtonfreelibrary.org/","telephone":"215-885-5180","email":"as&#99;&#104;wab&#64;mc&#108;i&#110;c&#46;or&#103;","sameAs":"https://www.abingtonfreelibrary.org/"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/earth-talk-monarch-butterflies-and-the-miracle-of-migration-with-author-mike-weilbacher/","category":"primary","availability":"inStock","validFrom":"2026-09-22T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Night at the Museum Movie Night at Tacony Community Garden","description":"&lt;p&gt;Come out for a screening of Night at the Museum, community, and snacks!Meet us at the corner of Longshore Ave and Keystone St at the Tacony Community Garden for another one of our fan favorite movie nights! Featuring Night at the Museum.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/9d3f20e125f9e86eef1e49837beedffa.jpg","url":"https://gridphilly.com/event/night-at-the-museum-movie-night-at-tacony-community-garden/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T19:00:00-04:00","endDate":"2026-09-30T21:00:00-04:00","location":{"@type":"Place","name":"Tacony Community Garden at Disston Park","description":"","url":"https://gridphilly.com/venue/tacony-community-garden-at-disston-park/","address":{"@type":"PostalAddress","streetAddress":"4930 Longshore Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19135","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Tacony Together","description":"","url":"https://visittacony.com","telephone":"","email":"","sameAs":"https://visittacony.com"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"North to Freedom Film Screening","description":"&lt;p&gt;Join us for a special film screening with Dionne Patterson of UGR3DAY Underground Railroad Experiences, Inc. ahead of our annual William Still Walk. Date Wednesday, September 30 Time 7:00 pm - 9:00 pm Location Virtual Join Fairmount Park Conservancy and Dionne Patterson of\u00a0UGR3DAY Underground Railroad Experiences, Inc.\u00a0for a special virtual screening of the documentary, North to Freedom. North to Freedom, an original documentary from WSKG Public Television and filmmaker Brian Frey, primarily examines the important role Upstate New York played in the Underground Railroad during the years leading up to and during the American Civil War. The film, however, also&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-24-at-4.15.12-PM.png","url":"https://gridphilly.com/event/north-to-freedom-film-screening/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-09-30T19:00:00-04:00","endDate":"2026-09-30T21:00:00-04:00","location":{"@type":"Place","name":"Online/Virtual","description":"","url":"https://gridphilly.com/venue/online-virtual/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":"https://www.schuylkillcenter.org/blog/upcoming-events/"},"organizer":{"@type":"Person","name":"Fairmount Park Conservancy","description":"","url":"https://myphillypark.org/","telephone":"","email":"","sameAs":"https://myphillypark.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"One Time Adult Wheel Class","description":"&lt;p&gt;Join our one time class to learn the basics of wheel throwing! There is a $15.00 fee if you would like to keep what you throw. We will then finish and glaze your piece with a color of your choosing, and your piece will be ready for pick up 4 weeks after your class. We will notify you when your piece is finished, and we will hold your piece for 1 month after its completion before donating it. Please note that you must clean your wheel and area thoroughly at the end of class. This class is BYOB friendly! The&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/unnamed.jpg","url":"https://gridphilly.com/event/one-time-adult-wheel-class/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T08:00:00-04:00","endDate":"2026-10-01T17:00:00-04:00","location":{"@type":"Place","name":"Blue Skies Pottery &#8211; Bryn Mawr","description":"","url":"https://gridphilly.com/venue/blue-skies-pottery-bryn-mawr/","address":{"@type":"PostalAddress","streetAddress":"933 W Lancaster Ave.","addressLocality":"Bryn Mawr","postalCode":"19010","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Blue Skies Pottery: Bryn Mawr","description":"","url":"","telephone":"610-672-0008","email":"&#105;n&#102;&#111;&#64;&#98;l&#117;&#101;&#115;k&#105;&#101;&#115;pott&#101;ry&#46;&#99;&#111;m","sameAs":""},"offers":{"@type":"Offer","price":"85.00","priceCurrency":"USD","url":"https://gridphilly.com/event/one-time-adult-wheel-class/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Thursday Volunteer Service Day","description":"&lt;p&gt;Meeting Location TBD Parking:\u00a0TBD Bathrooms:\u00a0TBD Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join Friends of the Wissahickon staff, Crew Leaders, and Trail Ambassadors in a variety of stewardship tasks! All are welcome to attend, and no experience is needed. We encourage attendees to work within their own comfort level, and we always strive to accommodate needs on an individual basis. With that being said, this service day may include the following activities: \u2022 Trail work: using long-handled tools for digging, raking, and scraping; moving heavy objects \u2022 Planting site preparation: using long&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/fowearthday2025-thegraylens-19-scaled-fSeVgV.jpg","url":"https://gridphilly.com/event/thursday-volunteer-service-day-65/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T09:00:00-04:00","endDate":"2026-10-01T12:00:00-04:00","performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Mindful Birding","description":"&lt;p&gt;Mindful birding combines observing birds with mindfulness techniques, creating a practice that incorporates heightened awareness. Labeling or identifying birds is not the primary focus. Instead, the intention is to slow down and notice the world around us, using birds as our guides. During this guided experience, you\u2019ll practice simple mindfulness exercises to engage sensory awareness while intentionally tuning into the birds surrounding you.\u00a0\u00a0 Techniques and prompts accompany this gently guided walk and/or \u201csit spot\u201d experience, which strive to enhance our observation skills, promoting a deepening of our experiences with birds around us. This in turn amplifies the multitude of benefits&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Hooded-Warbler-Crows-Nest-2014-0506-Jim-Moffett-medium-e1771529740324-GhqucS.jpg","url":"https://gridphilly.com/event/mindful-birding/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T09:30:00-04:00","endDate":"2026-10-01T12:00:00-04:00","location":{"@type":"Place","name":"Stoneleigh: &lt;em&gt;a natural garden&lt;/em&gt;","description":"&lt;p&gt;Stoneleigh is the public garden of nonprofit Natural Lands. The garden provides joy and well-being for thousands of guests every year through inspiring displays of native plants that support local ecology in a magnificent former Main Line estate. parking There is a 63-car asphalt parking lot at the main entrance to the garden at 1829 East County Line Road, Villanova, PA 19085. guest hours Tuesday &#8211; Sunday, 10:00 AM to 5:00 PM. Closed Mondays. more garden information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/stoneleigh-a-natural-garden-2/","address":{"@type":"PostalAddress","streetAddress":"1829 County Line Road","addressLocality":"Villanova","addressRegion":"Pennsylvania","postalCode":"19085"},"telephone":"610-353-5587 x200","sameAs":"https://www.natlands.org/stoneleigh/visit/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Leaf &#038; Learn","description":"&lt;p&gt;At our Leaf &amp; Learn program, kids ages 2-5 can get their first taste of volunteering for a good cause! In a supportive atmosphere, they\\'ll show care for the park with easy, age-appropriate tasks. This includes things like planting seeds, picking up small pieces of trash with kid-sized grabbers, and &quot;feeding&quot; a worm farm with shredded paper. By being part of this volunteer group, kids will learn that they are an important member of a community that helps keep their neighborhood clean and green. The group will meet at the FDR Park Learning Garden. Enter at the Broad Street entrance&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Leaf-and-Learn-2026.png","url":"https://gridphilly.com/event/leaf-learn-4/2026-10-01/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T10:00:00-04:00","endDate":"2026-10-01T11:00:00-04:00","location":{"@type":"Place","name":"FDR Park","description":"","url":"https://gridphilly.com/venue/fdr-park/","address":{"@type":"PostalAddress","streetAddress":"South Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19145","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Friends of FDR Park","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Orchard Tenders","description":"&lt;p&gt;Join us for a monthly orchard workday! Learn all about the plants in our Community Orchard, and what it takes to maintain them!Did you know that Cobbs Creek Community Environmental Center has a &quot;Community Orchard&quot;? Filled with dozens of species of herbs, native flowers, and fruit-bearing trees, shrubs, and vines, this orchard is both a learning space and a food producer!Join us for &quot;Orchard Tenders&quot;, a monthly volunteer orchard workday, every First Thursday from 10am-12pm!Learn the basics of orchard care, discover how to identify plants, and lend a hand in making this unique space even more beautiful!We\\'ll be getting our&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/06/a012d1f11ad00e9d80b019a32e6d28d9.jpg","url":"https://gridphilly.com/event/orchard-tenders-5/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T10:00:00-04:00","endDate":"2026-10-01T12:00:00-04:00","location":{"@type":"Place","name":"700 Cobbs Creek Pkwy","description":"","url":"https://gridphilly.com/venue/700-cobbs-creek-pkwy/","address":{"@type":"PostalAddress","streetAddress":"700 Cobbs Creek Parkway","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19143","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Cobbs Creek Community Environmental Center","description":"","url":"https://www.facebook.com/CobbsEnvCenter/","telephone":"","email":"","sameAs":"https://www.facebook.com/CobbsEnvCenter/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Ecological Arboriculture","description":"&lt;p&gt;Learn the practices Mt. Cuba\u2019s arborists use to integrate ecological thinking into every aspect of tree care, from planting and maintenance to risk assessment and long-term conservation. This course blends traditional arboriculture with cutting-edge ecological approaches, offering insight rarely featured in conventional training programs. \ud83e\udd6cDevelop the ability to analyze and prepare planting sites so young trees establish successfully and support long-term landscape goals. \ud83e\udd6cBuild skill in evaluating the biomechanical condition of mature trees, recognizing structural defects, and implementing mitigation strategies which balance safety with ecological value. \ud83e\udd6cExplore how senescent, damaged, and dead trees can be retained or repurposed to provide&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/04/Tree-canopy-fall-scaled-Vzx52G.jpg","url":"https://gridphilly.com/event/ecological-arboriculture-3/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T10:00:00-04:00","endDate":"2026-10-01T14:30:00-04:00","location":{"@type":"Place","name":"Mt Cuba","description":"","url":"https://gridphilly.com/venue/mt-cuba/","address":{"@type":"PostalAddress","streetAddress":"3120 Barley Mill Rd","addressLocality":"Hockessin","addressRegion":"DE","postalCode":"19707","addressCountry":"United States"},"telephone":"","sameAs":"https://mtcubacenter.org/venue/mt-cuba/"},"offers":{"@type":"Offer","price":"299","priceCurrency":"USD","url":"https://gridphilly.com/event/ecological-arboriculture-3/","category":"primary","availability":"inStock","validFrom":"2026-04-18T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-01/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T12:00:00-04:00","endDate":"2026-10-01T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"The Art of Noticing: A Mindful Outdoor Experience","description":"&lt;p&gt;Escape the hustle and bustle and immerse yourself in the soothing sights, sounds, and scents of nature during this mindful outdoor experience. This unique afternoon invites you to step into the peaceful embrace of the meadows and forest, guided by the rhythm of your footsteps and the sensory wonders that surround you.\u00a0 The stroll is perfect for those seeking a calm, reflective experience or anyone wishing to reconnect with nature on a deeper level. All ages and fitness levels are welcome, as the pace is leisurely, with plenty of time to pause and soak in the natural beauty around you.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Saunders-Woods-Trail2_MaeAxelrod-medium-e1743712125583-9Ioooi.jpg","url":"https://gridphilly.com/event/the-art-of-noticing-a-mindful-outdoor-experience/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T13:30:00-04:00","endDate":"2026-10-01T15:00:00-04:00","location":{"@type":"Place","name":"Saunders Woods Preserve","description":"&lt;p&gt;Saunders Woods Preserve is a natural oasis for wildlife and community residents in the heart of the Main Line. The Bridlewild Trail passes through the preserve and connects to a wider system of paths that wind through the community. A walk here reveals a lively forest habitat as well as an open meadow that is home to a variety of bird species. parking 8/10 of a mile northeast of Morris Avenue on Waverly Road. visitor hours Thursday &#8211; Tuesday, dawn to dusk. Closed Wednesday. more preserve information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/saunders-woods-preserve/","address":{"@type":"PostalAddress","streetAddress":"1020 Waverly Road","addressLocality":"Gladwyne","addressRegion":"PA","postalCode":"19035"},"telephone":"","sameAs":"https://www.natlands.org//visit/saunders-woods-preserve/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Relax &amp; Paint For NATURE &amp; ANIMAL Lovers","description":"&lt;p&gt;Unleash your inner artist at our animal-themed painting event - no experience required, just good vibes and creativity!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/04/f9831b1ebf98e339e207f697ed6230d6.jpg","url":"https://gridphilly.com/event/relax-paint-for-nature-animal-lovers-6/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T15:00:00-04:00","endDate":"2026-10-01T17:00:00-04:00","location":{"@type":"Place","name":"Deal Street Arts &amp; Community Center","description":"","url":"https://gridphilly.com/venue/deal-street-arts-community-center/","address":{"@type":"PostalAddress","streetAddress":"1537 Deal Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19124","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Deal Street Arts &amp; Community Center","description":"","url":"https://nonprofitmessenger.wixsite.com/dealstreetevents","telephone":"","email":"","sameAs":"https://nonprofitmessenger.wixsite.com/dealstreetevents"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Weekly Teen Open Studio Ages 13-19","description":"&lt;p&gt;Weekly Teen Open Studio. Ages 13-19. Come make art!Join us for a free low pressure hang out with other teens! We will have several instructors to assist in learning new skills. We will have art supplies, drawing and paint materials, paper crafts, sewing/crochet/knit supplies and snacks!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/12/4c8f7dc68120a0846990f3466c236845.jpg","url":"https://gridphilly.com/event/weekly-teen-open-studio-ages-13-19-8/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T15:00:00-04:00","endDate":"2026-10-01T20:00:00-04:00","location":{"@type":"Place","name":"The Tacony LAB Community Art Center","description":"","url":"https://gridphilly.com/venue/the-tacony-lab-community-art-center/","address":{"@type":"PostalAddress","streetAddress":"6918 Torresdale Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19135","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"The Tacony LAB Community Arts Center","description":"","url":"http://www.facebook.com/taconyLAB/","telephone":"","email":"","sameAs":"http://www.facebook.com/taconyLAB/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Autumn Avian Adventures \u2013 Murmuration &#038; Migrations","description":"&lt;p&gt;Natural Lands\u2019 diverse habitats sustain a variety of avian species. We\u2019ll look for migratory and resident birds, including songbirds, raptors, and more.\u00a0\u00a0\u00a0 Bring your binoculars and join us for a seasonal walk around one of our preserved open spaces.\u00a0\u00a0\u00a0 The songbirds, raptors, waterfowl, and shorebirds\u2014about 300 recorded species\u2014that rely on habitats under Natural Lands care are not just beautiful but also essential to the health of our planet. What\u2019s more, they are environmental indicators, warning us of climate shifts and other ecosystem changes.\u00a0\u00a0\u00a0 Learn more about what Natural Lands is doing for bird conservation.\u00a0 Can\u2019t attend this one? Check out&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Donate_DSC_7017_02-wood-thrush-and-fledgling-mt-joy-06-07-22-bill-moses-y3BVKG.jpg","url":"https://gridphilly.com/event/autumn-avian-adventures-murmuration-migrations/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T16:00:00-04:00","endDate":"2026-10-01T17:30:00-04:00","location":{"@type":"Place","name":"Summerhill Preserve","description":"","url":"https://gridphilly.com/venue/summerhill-preserve/","address":{"@type":"PostalAddress","streetAddress":"6029 Goshen Road","addressLocality":"Newtown Square","addressRegion":"Pennsylvania","postalCode":"19073"},"telephone":"","sameAs":"https://www.natlands.org/venue/summerhill-preserve/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Happy Hour at Newlin Grist Mill","description":"&lt;p&gt;Beer garden, food truck, live music Succession Fermentory will be at the park on Thursday evenings in September and October for weekly pop-up happy hours with a variety of beers and other beverages for sale. Stop by to sip some drinks, play games, and relax by the creek with friends. A great way to unwind after work or a walk in the park! Thursdays, 5-8PM, September &amp; October&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-01-at-9.49.03-AM.png","url":"https://gridphilly.com/event/happy-hour-at-newlin-grist-mill/2026-10-01/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T17:00:00-04:00","endDate":"2026-10-01T20:00:00-04:00","location":{"@type":"Place","name":"Newlin Grist Mill","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"219 Cheyney Road","addressLocality":"Glen Mills","postalCode":"19342","addressCountry":"United States"},"telephone":"610-459-2359","sameAs":"https://newlingristmill.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Fall Garden Party","description":"&lt;p&gt;Our annual garden party is back! Come enjoy food, drinks and games while supporting nutrition and agriculture education in Philadelphia!Join us Thursday, October 1st for food, drinks, games and an evening in the garden.Our annual garden party brings together friends, community and partners to celebrate the growing season and raise funds for next year\\'s programs!This is a pay what you can donation based event. Make a donation now or during the event but please RSVP to let us know you\\'re coming. We suggest a $30 donation or whatever is a meaningful contribution for you.100% of donation will go towards garden&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/c1af639df4ad9c0b97865a261543a92d.jpg","url":"https://gridphilly.com/event/fall-garden-party-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T17:00:00-04:00","endDate":"2026-10-01T20:00:00-04:00","location":{"@type":"Place","name":"Fort Mifflin","description":"","url":"https://gridphilly.com/venue/fort-mifflin/","address":{"@type":"PostalAddress","streetAddress":"Fort Mifflin","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19153","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Blue Sky Gardens","description":"","url":"https://blueskygardens.org/","telephone":"","email":"","sameAs":"https://blueskygardens.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Wissahickon Trails Green Ribbon Gathering","description":"&lt;p&gt;New Name - Same Mission! Green Ribbon Gathering Thursday, October 1, 2026\u00a0- 5:00pm - 8:00pm The Factory at Ridge Hall, 15 S. Ridge Ave., Ambler, PA 19002 REPLY ONLINE We invite you to join us for the\u00a0Green Ribbon Gathering, our signature celebration of conservation and community. Formerly known as the Green Ribbon Gala, the event has been renamed to better reflect the spirit of the evening - welcoming, relaxed, and rooted in community. For nearly 70 years, Wissahickon Trails has worked to protect the streams, forests, and open spaces that make our region such a special place to live, work,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-25-at-2.21.28-PM.png","url":"https://gridphilly.com/event/wissahickon-trails-green-ribbon-gathering/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T17:00:00-04:00","endDate":"2026-10-01T20:00:00-04:00","location":{"@type":"Place","name":"The Factory At Ridge Hall","description":"","url":"https://gridphilly.com/venue/the-factory-at-ridge-hall/","address":{"@type":"PostalAddress","streetAddress":"15 S. Ridge Ave","addressLocality":"Ambler","addressRegion":"PA","postalCode":"19002"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Wissahickon Trails","description":"","url":"https://wissahickontrails.org","telephone":"","email":"","sameAs":"https://wissahickontrails.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"HCA General Meeting","description":"&lt;p&gt;Harrowgate Civic Association takes care of the neighborhood surrounding Harrowgate Park. Monthly neighbors\u2019 meetings include updates from the neighborhood, Friends of Harrowgate Park, and the 24th District Police. Learn more on Facebook.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/HCA-bV6OyZ.jpg","url":"https://gridphilly.com/event/hca-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-01T18:30:00+00:00","endDate":"2026-10-01T20:30:00+00:00","location":{"@type":"Place","name":"St. Joan of Arc Church, 3546 Frankford Ave, Philadelphia, PA, 19134","description":"","url":"https://gridphilly.com/venue/st-joan-of-arc-church-3546-frankford-ave-philadelphia-pa-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-02/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T00:00:00-04:00","endDate":"2026-10-02T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"&#98;&#101;ard&#101;d&#108;ad&#105;esc&#97;b&#97;r&#101;t&#64;gm&#97;&#105;&#108;&#46;c&#111;m","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-02/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Friday Volunteer Days with Riverfront North &#8211; Pennypack on the Delaware","description":"&lt;p&gt;Spring Volunteer Opportunities!Join us on Fridays for a morning of stewardship along the Riverfront North Greenway! Our Friday volunteer series rotates between Pennypack on the Delaware and Lardner\u2019s Point Park, giving you the chance to support the park nearest you\u2014or discover a new favorite spot. We can\u2019t wait to see you out there!Gloves and tools are provided. Close-toed shoes are required. Bring a refillable water bottle if possible. Light snacks and water provided.Minors need a parent\\'s signature to participate. Anyone under 16 must have a parent or guardian with them during the volunteer event.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/8feea64ef198b0c441005cc90722be4f.jpg","url":"https://gridphilly.com/event/friday-volunteer-days-with-riverfront-north-pennypack-on-the-delaware-11/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T09:00:00-04:00","endDate":"2026-10-02T12:00:00-04:00","location":{"@type":"Place","name":"Pennypack on the Delaware","description":"","url":"https://gridphilly.com/venue/pennypack-on-the-delaware/","address":{"@type":"PostalAddress","streetAddress":"Pennypack on the Delaware Park, 7801 State Road","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19136","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Riverfront North Partnership","description":"","url":"http://riverfrontnorth.org","telephone":"","email":"","sameAs":"http://riverfrontnorth.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Watercolor in the Garden","description":"&lt;p&gt;Join horticulturist Mitch for an session of watercolor!Join us in the garden and learn the basics of watercolor in this 3-hour seminar. Together, we will experiment with layering colors, creating texture, and building value as you find inspiration around Haverford College Arboretum.This class will be held outside, with an inside space available in the case of inclement weather. All participants will need to bring their own materials for this class, and a materials list will be emailed to all participants in advance of the class.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/9a2b4cf23352e97cc20941a176d04845.jpg","url":"https://gridphilly.com/event/watercolor-in-the-garden-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T11:00:00-04:00","endDate":"2026-10-02T14:00:00-04:00","location":{"@type":"Place","name":"Haverford College Arboretum","description":"","url":"https://gridphilly.com/venue/haverford-college-arboretum/","address":{"@type":"PostalAddress","streetAddress":"370 Lancaster Avenue","addressLocality":"Haverford","addressRegion":"PA","postalCode":"19041","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Haverford College Arboretum","description":"","url":"https://www.haverford.edu/arboretum","telephone":"","email":"","sameAs":"https://www.haverford.edu/arboretum"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-02/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T12:00:00-04:00","endDate":"2026-10-02T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"One Art Volunteer Day","description":"&lt;p&gt;Every first Friday of the month we invite the community out to spend the day tending to the land, learning and growing with us&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/07/c4731b5ef528c87f3333471aec0ee5e3.jpg","url":"https://gridphilly.com/event/one-art-volunteer-day-5/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T12:00:00-04:00","endDate":"2026-10-02T17:00:00-04:00","location":{"@type":"Place","name":"5150 Warren St","description":"","url":"https://gridphilly.com/venue/5150-warren-st/","address":{"@type":"PostalAddress","streetAddress":"5150 Warren Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19131","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"One Art Community Center","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Compost 101 with Bennett Compost","description":"&lt;p&gt;Learn how to start your own successful home compost bin with compost professional Tim Bennett. Compost is key to a thriving garden and reducing your home food waste. This workshop will guide participants through the key steps of creating a successful at-home compost. Learn the different methods for home composting and choose the one best tailored to your needs. Let\u2019s get composting! Tim Bennett is the founder of Bennett Compost. Bennett Compost serves over 6,000 households and businesses in Philadelphia. Last year, they kept over 4 million pounds of food waste out of landfills.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Compost.jpeg","url":"https://gridphilly.com/event/compost-101-with-bennett-compost/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T14:00:00-04:00","endDate":"2026-10-02T15:00:00-04:00","location":{"@type":"Place","name":"Morris Arboretum &amp; Gardens","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"100 E Northwestern Ave","addressLocality":"Philadelphia","postalCode":"19118","addressCountry":"United States"},"telephone":"215-247-5777","sameAs":"https://www.morrisarboretum.org/"},"organizer":{"@type":"Person","name":"Morris Arboretum &amp; Gardens","description":"","url":"https://www.morrisarboretum.org","telephone":"215.247.5777","email":"&#109;ell&#97;n&#121;&#97;&#64;u&#112;e&#110;&#110;&#46;e&#100;u","sameAs":"https://www.morrisarboretum.org"},"offers":{"@type":"Offer","price":"35","priceCurrency":"USD","url":"https://gridphilly.com/event/compost-101-with-bennett-compost/","category":"primary","availability":"inStock","validFrom":"2026-08-31T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Cure Violence Kensington Friday Drop-In Hours","description":"&lt;p&gt;Our weekly Drop-In Center is a safe, judgment-free space to come as you are. You can grab coffee and food, play games, and connect with people who understand what you\u2019re going through. If you\u2019ve been caught up in street life, recently came home, or just need real support and a place to stay grounded\u2014you belong here. We can connect you to:\u00a0 Housing and utility assistance\u00a0 ID and personal documents\u00a0 Employment opportunities Legal support Food &amp; Clothing Stop by for an intake and see how we can support you and your needs. Contact Cure Violence at 215-427-0350&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Cure-Violence-Drop-in-Flyer-2KioR9.png","url":"https://gridphilly.com/event/cure-violence-kensington-friday-drop-in-hours-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T14:00:00-04:00","endDate":"2026-10-02T16:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Brew N&#8217; History Tour: Autumn Edition","description":"&lt;p&gt;Tour of our historic grounds with local beer pairings.Step into the historic Christ Church Burial Ground for an evening tour exploring the intersection of colonial brewing, tavern culture, and early American history.This guide-led tour highlights the final resting places of Revolutionary-era leaders, signers of the Declaration of Independence, and notable Philadelphians\u2014from Benjamin Franklin to a famous tavern keeper. Along the way, you will learn how 18th-century drink culture fueled political debate, social life, and daily routines in the early Republic. Five select stops feature a curated sampling of local craft beers paired directly with the historical figures and stories told&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/700af1c9af30dae883a01be19c5e3585.jpg","url":"https://gridphilly.com/event/brew-n-history-tour-autumn-edition/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T17:00:00-04:00","endDate":"2026-10-02T18:00:00-04:00","location":{"@type":"Place","name":"Christ Church Burial Ground","description":"","url":"https://gridphilly.com/venue/christ-church-burial-ground/","address":{"@type":"PostalAddress","streetAddress":"420 Arch Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19106","addressCountry":"United States"},"telephone":"","sameAs":"https://www.eventbrite.com/e/remember-the-ladies-tickets-1335194585949"},"organizer":{"@type":"Person","name":"Christ Church Preservation Trust","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Practice plant-based painting with Bonnie MacAllister","description":"&lt;p&gt;All materials included: fabric, painting supplies, and plant based paints made on the Delaware River Waterfront from local, farm sourced, and common kitchen plants. The collaborative paintings will be included in a second staging of Phantastic Phibers an exhibition scheduled for August 2027 at Cherry Street Pier. Free tickets and pay it forward tickets are available for the First Friday painting session. Bonnie MacAllister is a fourth year resident at Cherry Street Pier. Curator of the recent exhibition BORN ON THE BICENTENNIAL, her previous shows at the pier have included the original Phantastic Phibers, a large scale invitational multimedia fibers&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/IMG_6712-4.jpeg","url":"https://gridphilly.com/event/practice-plant-based-painting-with-bonnie-macallister/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T17:00:00-04:00","endDate":"2026-10-02T19:00:00-04:00","location":{"@type":"Place","name":"Cherry Street Pier, North Christopher Columbus Boulevard, Philadelphia, PA, USA","description":"","url":"https://gridphilly.com/venue/cherry-street-pier-north-christopher-columbus-boulevard-philadelphia-pa-usa/","address":{"@type":"PostalAddress","streetAddress":"121 North Christopher Columbus Boulevard","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19106","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Bonnie MacAllister: Studio 16 @ Cherry St Pier","description":"","url":"https://www.eventbrite.com/o/bonnie-macallister-studio-16-cherry-st-pier-73776162233","telephone":"","email":"","sameAs":"https://www.eventbrite.com/o/bonnie-macallister-studio-16-cherry-st-pier-73776162233"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Twilight in the Garden: A Benefit for Bartram\u2019s Garden","description":"&lt;p&gt;Twilight in the Garden is the annual gala to benefit Bartram\u2019s Garden and the year\u2019s largest fundraiser. Join us to celebrate this beloved public space and ensure its continued growth. This year, we honor changemakers whose work exemplifies the power of stewardship, advocacy, and partnership: The Pennsylvania Horticultural Society, under the leadership of President Matt Rader, and Congressman Dwight Evans. Learn more about our 2026 honorees here.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/DSC00762-bWQIeu.webp","url":"https://gridphilly.com/event/twilight-in-the-garden-a-benefit-for-bartrams-garden-4/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T17:30:00-05:00","endDate":"2026-10-02T21:30:00-05:00","performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"A Glimpse Elsewhere &#8211; Reception","description":"&lt;p&gt;Join us for the Reception of &quot;A Glimpse Elsewhere&quot; at the National Apartments (121 N. 2nd St, Phila. PA) This exhibition features artists Elisa Abeloff and Nanci Hersh October 2, 6p - 8p @The National Apartments, 121 N 2nd St, Philadelphia PA, 19106 In conjunction with Old City\\'s First Friday receptions! About the Exhibition: A Glimpse Elsewhere brings together artists Elisa Abeloff and Nanci Hersh, reminiscing about the past and understanding alternative perspectives in such fleeting moments. Each artist uses gestural patterns in their work, creating an airy atmosphere and feeling of retrospection. In Elisa\u2019s work, we see flashes of&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Screenshot-2026-08-26-at-10.51.35-AM-1.png","url":"https://gridphilly.com/event/a-glimpse-elsewhere-reception/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T18:00:00-04:00","endDate":"2026-10-02T20:00:00-04:00","location":{"@type":"Place","name":"The National Apartments","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"121 N 2nd St","addressLocality":"Philadelphia","postalCode":"19106","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"INLIQUID","description":"","url":"http://0","telephone":"0","email":"0","sameAs":"http://0"},"offers":{"@type":"Offer","price":"Free \u2013 10","priceCurrency":"USD","url":"https://gridphilly.com/event/a-glimpse-elsewhere-reception/","category":"primary","availability":"inStock","validFrom":"2026-08-31T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tacony LAB First Friday Spooky Maker Market","description":"&lt;p&gt;Tacony LAB First Friday Spooky Makers Market. In partnership with Tacony Together. This is a Fall for Tacony EventJoin us for our Spooky Maker Market!This October, we will have various makers who will be selling their handmade work. First Fridays at the Tacony LAB are about celebrating art &amp; community. Join us for refreshments and art activities that change each month.Registration is encouraged but not required in order to help us plan.The Tacony LAB is grateful for the support of the Tacony Together Team(Formerlly Tacony Community Development Corporation) as we grow our creative community here in Tacony and the surrounding&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2024/03/c3e30efecf05dc08897572682e973027.jpg","url":"https://gridphilly.com/event/tacony-lab-first-friday-spooky-maker-market/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T18:00:00-04:00","endDate":"2026-10-02T20:30:00-04:00","location":{"@type":"Place","name":"The Tacony LAB Community Arts Center","description":"","url":"https://gridphilly.com/venue/the-tacony-lab-community-arts-center/","address":{"@type":"PostalAddress","streetAddress":"6918 Torresdale Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19135","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"The Tacony LAB Community Arts Center","description":"","url":"http://www.facebook.com/taconyLAB/","telephone":"","email":"","sameAs":"http://www.facebook.com/taconyLAB/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Philly Homegrown First Fridays","description":"&lt;p&gt;Celebrate community, creativity, and culture at First Friday Homegrown a recurring series dedicated to spotlighting Philly\u2019s very own!We created the Philly Homegrown section to uplift Philly\u2019s creative community providing a platform for local talent to shine and a space for neighbors to discover, support, and celebrate the artistry rooted in our city. Each month, we open our doors for an evening of local love: shop unique, handcrafted goods, meet the makers, and connect with your neighbors. Enjoy complimentary wine, light refreshments, and a vibrant atmosphere where art, plants, and people come together.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/10/8693206e4e2005e0317923baed4746c5.jpg","url":"https://gridphilly.com/event/philly-homegrown-first-fridays-13/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T18:00:00-04:00","endDate":"2026-10-02T21:00:00-04:00","location":{"@type":"Place","name":"Plant and People","description":"","url":"https://gridphilly.com/venue/plant-and-people/","address":{"@type":"PostalAddress","streetAddress":"3952 Lancaster Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Plant and People","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Illuminate Passyunk","description":"&lt;p&gt;Iluminate Passyunk is a free projection arts festival in East Passyunk, transforming public spaces into canvases for local artists through projection mapping, interactive installations, and live audiovisual performances. The event will feature artists from the Philadelphia Region and create an accessible platform for emerging creatives to experiment, perform, and connect with the community. Illuminate Passyunk is part of the larger Illuminate Philly initiative. Our mission is to illuminate neighborhoods throughout the city, making projection art accessible outside of traditional gallery spaces while supporting Philadelphia\u2019s growing community of digital and immersive artists.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/ILLUMINATE-PASSYUNK.png","url":"https://gridphilly.com/event/illuminate-passyunk/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T19:00:00-04:00","endDate":"2026-10-02T23:00:00-04:00","location":{"@type":"Place","name":"singing fountain","description":"","url":"https://gridphilly.com/venue/singing-fountain/","address":{"@type":"PostalAddress","streetAddress":"S 11th St &amp; E Passyunk Ave, Philadelphia, PA","addressLocality":"Philadelphia","postalCode":"19147","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Illuminate Philly","description":"","url":"https://www.instagram.com/illuminatephilly/","telephone":"","email":"i&#108;l&#117;mi&#110;a&#116;e&#112;&#104;i&#108;ly&#64;out&#108;&#111;&#111;&#107;.&#99;&#111;&#109;","sameAs":"https://www.instagram.com/illuminatephilly/"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/illuminate-passyunk/","category":"primary","availability":"inStock","validFrom":"2026-09-22T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"These Shining Lives by Melanie Marnich at The Stagecrafters Theater","description":"&lt;p&gt;Four young women meet and forge a bond while working a well-paying job in 1920s rural Illinois, for the Radium Dial Company. Years later, as they realize that the work has compromised their health, they bravely choose to hold the firm accountable. The Stagecrafters Theater 8130 Germantown Ave, Chestnut Hill, Philadelphia PA 19118 \u25cf Friday and Saturday, September 18-19 @ 7:30pm (musical performance before opening night) \u25cf Sunday, September 20 @ 2pm (with a panel discussion to follow the performance) \u25cf Thursday, Friday and Saturday, September 24-26 @ 7:30pm \u25cf Thursday, Friday and Saturday, October 1-3 @ 7:30pm \u25cf Sunday,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shining_postcard.jpg","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-02/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-02T19:30:00-04:00","endDate":"2026-10-02T21:00:00-04:00","location":{"@type":"Place","name":"The Stagecrafters Theater","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"8130 Germantown Ave","addressLocality":"Philadelphia","addressRegion":"P","postalCode":"19118","addressCountry":"United States"},"telephone":"2152479913","sameAs":"https://thestagecrafters.org/"},"organizer":{"@type":"Person","name":"The Stagecrafters Theater","description":"","url":"https://www.thestagecrafters.org","telephone":"2152479913","email":"&#106;tocz&#101;k&#64;t&#104;est&#97;&#103;&#101;&#99;ra&#102;&#116;e&#114;&#115;.org","sameAs":"https://www.thestagecrafters.org"},"offers":{"@type":"Offer","price":"26 \u2013 30","priceCurrency":"USD","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-02/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Weekend Bird Walk with the Birding Club of Delaware County","description":"&lt;p&gt;FOR ADULTS &amp; TEENS 13+| PRE-REGISTRATION REQUIRED Discover the birds of Tyler Arboretum on a guided walk through forests and meadows with experts from the Birding Club of Delaware County. Listen for songs and calls, watch for movement in the trees, and experience the wonders of this Audubon-recognized Important Bird Area up close. All levels of birding experience welcome. Gates open at 7:45 am. Check in with your guide on the Visitor Center patio. Group leaves from the parking lot at 8:00 am; please arrive on time. Restrooms will be open. What to expect: We will be walking at a&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/TylerBirding.png","url":"https://gridphilly.com/event/weekend-bird-walk-with-the-birding-club-of-delaware-county-7/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T08:00:00-04:00","endDate":"2026-10-03T10:00:00-04:00","location":{"@type":"Place","name":"Tyler Arboretum","description":"","url":"https://gridphilly.com/venue/tyler-arboretum/","address":{"@type":"PostalAddress","streetAddress":"515 Painter Rd","addressLocality":"Media","addressRegion":"PA","addressCountry":"United States"},"geo":{"@type":"GeoCoordinates","latitude":39.933346,"longitude":-75.440244},"telephone":"6105669134","sameAs":"https://tylerarboretum.org/venue/tyler-arboretum-8/"},"organizer":{"@type":"Person","name":"Tyler Arboretum","description":"","url":"https://tylerarboretum.org/","telephone":"610-566-9134","email":"&#116;m&#97;&#108;lo&#110;&#64;t&#121;&#108;&#101;ra&#114;b&#111;&#114;et&#117;&#109;.&#111;&#114;&#103;","sameAs":"https://tylerarboretum.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Shiverfest Fall festival","description":"&lt;p&gt;Every fall, Riverbend Environmental Education Center transforms into a spooooook-tacular family festival. Shiverfest brings together food trucks, live entertainment, animals, crafts, and community, all set against the backdrop of the preserve. Shiverfest is a fundraiser that helps Riverbend provide free and accessible nature education to kids. Every ticket, sponsorship, and donation directly supports that mission. Discounted tickets available for SNAP/EBT/ PA ACCESS cardholders. Email tmountain@riverbendeec.org.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shiverfest2025_Highlights-7-scaled.jpg","url":"https://gridphilly.com/event/shiverfest-fall-festival/2026-10-03/1/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T08:00:00-04:00","endDate":"2026-10-03T17:00:00-04:00","location":{"@type":"Place","name":"Riverbend Environmental Education Center","description":"","url":"https://gridphilly.com/venue/riverbend-environmental-education-center/","address":{"@type":"PostalAddress","streetAddress":"1950 Spring Mill Road","addressLocality":"Gladwyne","addressRegion":"PA","postalCode":"19035","addressCountry":"United States"},"telephone":"","sameAs":"https://riverbendeec.org/"},"organizer":{"@type":"Person","name":"Riverbend Environmental Education Center","description":"","url":"https://riverbendeec.org/","telephone":"","email":"","sameAs":"https://riverbendeec.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Bird Walk Along the Wissahickon (Part 3) with Troy Bynum","description":"&lt;p&gt;Meeting at Houston Playground (900 Grakyn Lane) Get to know the birds of Wissahickon Valley Park through this four-part guided bird walk series, hosted by Troy Bynum of TB Wildlife Photography LLC in partnership with Friends of the Wissahickon. Participants will learn practical tips for identifying common species and gain insight into how different birds use the park\u2019s diverse habitats throughout the seasons. Attend the full series to follow the changing landscape over time, or join a single hike\u2014everyone is welcome. Difficulty: Moderate (some inclines and declines, uneven surfaces) Parking: There should be plenty of free street parking along Grakyn&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/fowfamilybirdinghike-thegraylens-36-scaled-Sbdmlg.jpg","url":"https://gridphilly.com/event/bird-walk-along-the-wissahickon-part-3-with-troy-bynum/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T09:00:00-04:00","endDate":"2026-10-03T11:00:00-04:00","location":{"@type":"Place","name":"Houston Playground, 900 Grakyn Lane, Philadelphia, PA, 19128, United States","description":"","url":"https://gridphilly.com/venue/houston-playground-900-grakyn-lane-philadelphia-pa-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Saturday Volunteer Service Day","description":"&lt;p&gt;Meeting Location TBD Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join us as we prepare for an upcoming planting! All are welcome to attend, and no experience is needed. We encourage attendees to work within their own comfort level, and we always strive to accommodate needs on an individual basis. With that being said, this service day may include the following activities: \u2022 Planting site preparation: using long handled tools for cutting, scraping, and digging \u2022 Litter clean-up We provide gloves, tools, and instruction\u2013you just need to show up! Be sure to&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/IMG_4183-4AUt1J.jpg","url":"https://gridphilly.com/event/saturday-volunteer-service-day-9/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T09:00:00-04:00","endDate":"2026-10-03T12:00:00-04:00","performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Myths, Legends, Hermits, Bridges of the Wissahickon PLUS Kelpius&#8217; Music Live","description":"&lt;p&gt;Meeting at Historic RittenhouseTown (208 Lincoln Dr, Philadelphia) This will be the 7th in a series of guided walks exploring some of the mysticism, mythology, religion, legends, history, art, music, and architecture found within the Wissahickon. We will have ample time to examine these from the three different perspectives of history, theology, and psychology. Along the way, we will visit Lover\u2019s Leap, the Henry Avenue Bridge, the Hermitage, and Kelpius\u2019 Cave. At each of these sites, we will consider topics ranging from hidden subway stations, apocalyptic movements, and the Wissahickon\u2019s most famous hermit. We will hear a live encore performance&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/07/hrt-cover-scaled-EKBLgH.jpg","url":"https://gridphilly.com/event/myths-legends-hermits-bridges-of-the-wissahickon-plus-kelpius-music-live/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T09:30:00-04:00","endDate":"2026-10-03T13:00:00-04:00","location":{"@type":"Place","name":"Historic Rittenhouse Town, 6035-6049 Wissahickon Ave, Philadelphia, PA, 19144, United States","description":"","url":"https://gridphilly.com/venue/historic-rittenhouse-town-6035-6049-wissahickon-ave-philadelphia-pa-19144-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Herbalism Workshop Series at FDR Park","description":"&lt;p&gt;We\u2019ve made a few updates to the dates for our free Herbalism 101 workshop series with Majesty! Join us as we explore wild herbs and plants and learn about their medicinal and nutritional properties. Come learn, explore, and connect with the plants growing around us! Meet: Guard House / Main Office Time: 10:00 AM Workshop Dates: September 19 October 3, 10, 17, 24, 31 These free classes were made possible with support from the DCNR.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Herbalism.jpeg","url":"https://gridphilly.com/event/herbalism-workshop-series-at-fdr-park/2026-10-03/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T10:00:00-04:00","endDate":"2026-10-03T11:00:00-04:00","location":{"@type":"Place","name":"FDR Park Welcome Center","description":"","url":"https://gridphilly.com/venue/fdr-park-welcome-center/","address":{"@type":"PostalAddress","streetAddress":"1500 Pattison Avenue &amp;, S Broad St,","addressLocality":"Philadelphia","postalCode":"19145","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Friends of FDR Park","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tyler Arboretum Bioblitz Oct 2026: Guided Walk","description":"&lt;p&gt;FOR ADULTS &amp; TEENS AGES 12-17 | PRE-REGISTRATION REQUIRED Help document the diversity of life found across Tyler Arboretum. Explore meadow and forest ecosystems on this guided Bioblitz walk with Tyler staff and volunteers. Search for wildflowers, pollinators, birds, insects, fungi, and other species while learning about the habitats that support them. As you move from open grassland into the forest, observe how the diversity of life changes from one habitat to another. Beginners and experienced iNaturalist users are welcome. Contribute your observations to a community science project and help build a better understanding of Tyler\u2019s plants, animals, fungi, and&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/TylerBioBlitz.png","url":"https://gridphilly.com/event/tyler-arboretum-bioblitz-oct-2026-guided-walk/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T10:00:00-04:00","endDate":"2026-10-03T12:00:00-04:00","location":{"@type":"Place","name":"Tyler Arboretum","description":"","url":"https://gridphilly.com/venue/tyler-arboretum/","address":{"@type":"PostalAddress","streetAddress":"515 Painter Rd","addressLocality":"Media","addressRegion":"PA","addressCountry":"United States"},"geo":{"@type":"GeoCoordinates","latitude":39.933346,"longitude":-75.440244},"telephone":"6105669134","sameAs":"https://tylerarboretum.org/venue/tyler-arboretum-8/"},"organizer":{"@type":"Person","name":"Tyler Arboretum","description":"","url":"https://tylerarboretum.org/","telephone":"610-566-9134","email":"&#116;&#109;&#97;&#108;l&#111;&#110;&#64;tyler&#97;&#114;&#98;&#111;r&#101;&#116;um.&#111;r&#103;","sameAs":"https://tylerarboretum.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"NKCDC Weekend Gardening Club","description":"&lt;p&gt;Join our weekend gardening club! Build your gardening skills, share your knowledge and expertise, meet fellow gardeners and grow together while supporting local gardens and farms!\u00a0 Whether you\u2019re picking up a trowel for the first time or have years of gardening experience, we want you to be part of our garden community! Sign up here: https://m.signupgenius.com/#!/showSignUp/10C054CAEAB2EAAFBC34-65529185-nkcdc?useFullSite=false&lt;/p&gt;\\n","url":"ht
