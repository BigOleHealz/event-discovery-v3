ostalCode":"19131"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Fairmount Park Conservancy","description":"","url":"https://myphillypark.org/","telephone":"","email":"","sameAs":"https://myphillypark.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Philly 17.76 East Coast Greenway Alliance and Circuit Trails Coalition Celebrate the Delaware River Heritage Trail","description":"&lt;p&gt;East Coast Greenway Alliance and Circuit Trails Coalition Celebrate the Delaware River Heritage Trail Join the East Coast Greenway Alliance and\u00a0Circuit Trails Coalition\u00a0on Saturday, October 3 for a 17.76-mile, people-powered celebration of the 250th anniversary of the Declaration of Independence. Starting and finishing at Franklin Square in Philadelphia, participants can choose to bike or walk a 17.76-mile tour of historic sites along the Delaware River Heritage Trail segment of the East Coast Greenway in Philadelphia and Camden, New Jersey. A shorter walking option also will be available. This free, community event is designed to encourage participants to learn about and&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Philly.png","url":"https://gridphilly.com/event/philly-17-76-east-coast-greenway-alliance-and-circuit-trails-coalition-celebrate-the-delaware-river-heritage-trail/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T10:00:00-04:00","endDate":"2026-10-03T15:00:00-04:00","location":false,"organizer":{"@type":"Person","name":"Bicycle Coalition of Greater Philadelphia","description":"","url":"https://bicyclecoalition.org/","telephone":"","email":"","sameAs":"https://bicyclecoalition.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Heart of Kensington Creates Art Crawl","description":"&lt;p&gt;Take part in an unforgettable community event uniting creative visions and voices across Kensington!Join us for a community-wide art crawl and celebration of public art in Philadelphia\u2019s Kensington neighborhood. All spring and summer, local artists and community members have been busy creating public art that aims to shift the conversation in Kensington\u2014uplifting each community and building on shared Kensington pride. This event is the first chance to see all of the newly installed artwork and connect with the artists who made it.The crawl will begin at Harrowgate Park, before proceeding along Kensington Avenue with stops at McPherson Square Library and&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/3d057dd90815d62f7a7f9e71bfc57385.jpg","url":"https://gridphilly.com/event/heart-of-kensington-creates-art-crawl/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T10:00:00-04:00","endDate":"2026-10-03T16:00:00-04:00","location":{"@type":"Place","name":"Harrowgate Park","description":"","url":"https://gridphilly.com/venue/harrowgate-park/","address":{"@type":"PostalAddress","streetAddress":"3455 Kensington Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19134","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Mural Arts Philadelphia","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Mushroom Walk","description":"&lt;p&gt;Fancy a foray for fungi? Join our partners at the Philadelphia Mycology Club for a walk-and-talk through the garden in search of marvelous mushrooms. Together, we\u2019ll explore why fungi are essential contributors to healthy ecosystems and how to look for them responsibly. Whether you\u2019re enchanted by mushroom ecology or interested in improving your field observation skills, this is a relaxed and supportive program with space for all levels of experience.\u00a0\u00a0\u00a0 about our partner\u00a0\u00a0\u00a0 The Philadelphia Mycology Club is a 501(c)(3) non-profit organization founded in 2018 by Bethany Teigen and has since grown to include a diverse group of novice and&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/09/IMG_2853-e1752263210313-yGRip1.jpg","url":"https://gridphilly.com/event/mushroom-walk-9/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T10:30:00-04:00","endDate":"2026-10-03T12:00:00-04:00","location":{"@type":"Place","name":"Stoneleigh: &lt;em&gt;a natural garden&lt;/em&gt;","description":"&lt;p&gt;Stoneleigh is the public garden of nonprofit Natural Lands. The garden provides joy and well-being for thousands of guests every year through inspiring displays of native plants that support local ecology in a magnificent former Main Line estate. parking There is a 63-car asphalt parking lot at the main entrance to the garden at 1829 East County Line Road, Villanova, PA 19085. guest hours Tuesday &#8211; Sunday, 10:00 AM to 5:00 PM. Closed Mondays. more garden information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/stoneleigh-a-natural-garden-2/","address":{"@type":"PostalAddress","streetAddress":"1829 County Line Road","addressLocality":"Villanova","addressRegion":"Pennsylvania","postalCode":"19085"},"telephone":"610-353-5587 x200","sameAs":"https://www.natlands.org/stoneleigh/visit/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"DIY Pumpkin Succulent Planter","description":"&lt;p&gt;At this hands-on workshop, you will create a beautiful, long-lasting succulent arrangement inside a gourd-eous ceramic pumpkin planter!You will be provided with:\u00a0A beautiful ceramic planter (6&quot;);\u00a0A selection of succulents;\u00a0Soil;\u00a0Moss; and\u00a0Dried florals.\u00a0Our instructors will walk you through the potting process and provide a brief lecture on succulent plant care. You will learn about:\u00a0\u00a0Light and water requirements;\u00a0Propagation techniques; and\u00a0Repotting.\u00a0\u00a0You will leave with a beautiful fall succulent arrangement and the knowledge necessary to care of your new plants for many years to come!\u00a0&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/5bc14d2d8fcded947925178fb4054bc6.jpg","url":"https://gridphilly.com/event/diy-pumpkin-succulent-planter/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T11:00:00-04:00","endDate":"2026-10-03T12:00:00-04:00","location":{"@type":"Place","name":"Primex Garden Center","description":"","url":"https://gridphilly.com/venue/primex-garden-center/","address":{"@type":"PostalAddress","streetAddress":"435 West Glenside Avenue","addressLocality":"Glenside","addressRegion":"PA","postalCode":"19038","addressCountry":"United States"},"geo":{"@type":"GeoCoordinates","latitude":40.103645,"longitude":-75.160326},"telephone":"","sameAs":"https://primexgardencenter.com/"},"organizer":{"@type":"Person","name":"Primex  Garden Center","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Wild, Crawly &amp; Cool (All Ages)","description":"&lt;p&gt;Get ready for a spook-tacular journey into the world of creatures that crawl, slither, and flutter!Led by the Upper Main Line YMCA Environmental &amp; STEM Education NaturalistsMeet live animal ambassadors\u2014including gentle snakes, curious lizards, and incredible insects\u2014and discover how these often-misunderstood animals help keep ecosystems healthy and balanced. Learn why snakes are shy but important neighbors, and how many \u201ccreepy crawlies\u201d play a vital role in our gardens and forests. After the indoor program, head outdoors for a guided nature walk to look for insects, reptiles, and their habitats in the garden.Suitable for all ages. Children must be accompanied by&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/6fc032fc0959f158e1d80eeeedee2d34.jpg","url":"https://gridphilly.com/event/wild-crawly-cool-all-ages/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T11:00:00-04:00","endDate":"2026-10-03T12:00:00-04:00","location":{"@type":"Place","name":"Jenkins Arboretum &amp; Gardens","description":"","url":"https://gridphilly.com/venue/jenkins-arboretum-gardens-29/","address":{"@type":"PostalAddress","streetAddress":"631 Berwyn Baptist Road","addressLocality":"Devon","addressRegion":"PA","postalCode":"19333","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Jenkins Arboretum &amp; Gardens","description":"","url":"http://jenkinsarboretum.org","telephone":"","email":"","sameAs":"http://jenkinsarboretum.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Snipes Farm Fall Events: Harvest Tour","description":"&lt;p&gt;Meet your local farmers and sample our autumn produce fresh off the vine! All produce is grown using regenerative agricultural methods and donated to hunger relief. Stay after the tour to see the farm in full fall splendor \u2013 and don\u2019t miss the scarecrow scavenger hunt!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Fall-Events-1.png","url":"https://gridphilly.com/event/snipes-farm-fall-events-harvest-tour/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T11:00:00-04:00","endDate":"2026-10-03T13:00:00-04:00","location":{"@type":"Place","name":"Snipes Farm","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"890 W Bridge Street","addressLocality":"Morrisville","addressRegion":"PA","postalCode":"19067","addressCountry":"United States"},"telephone":"(215) 295-1138","sameAs":"https://www.snipesfarm.org/"},"organizer":{"@type":"Person","name":"Snipes Farm and Education Center","description":"","url":"https://snipesfarm.org/","telephone":"(215) 295-1138","email":"t&#117;cke&#114;m&#64;&#115;&#110;&#105;pe&#115;&#102;a&#114;m&#46;&#111;r&#103;","sameAs":"https://snipesfarm.org/"},"offers":{"@type":"Offer","price":"10","priceCurrency":"USD","url":"https://gridphilly.com/event/snipes-farm-fall-events-harvest-tour/","category":"primary","availability":"inStock","validFrom":"2026-08-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"20th Annual PAWS Mutt Strut","description":"&lt;p&gt;On Saturday, October 3, Philadelphia will once again go to the dogs! The Mutt Strut is the must-attend fall festival for dogs and the people who love them, and PAWS\u2019 biggest fundraising event of the year. Join us at The Navy Yard for a scenic walk, live music, food trucks, a beer garden, costume contests, games and activities for dogs and people, adoptable pups, and plenty more fall fun. Whether you\u2019re strutting with your own four-legged family member or coming to meet some new friends, every step helps PAWS raise critical funds and awareness for Philadelphia\u2019s most at-risk pets.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Mutt-Strut-2026-InstagramSocial-Media-4x5-Costumes.png","url":"https://gridphilly.com/event/20th-annual-paws-mutt-strut/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T11:00:00-04:00","endDate":"2026-10-03T14:00:00-04:00","location":{"@type":"Place","name":"The Navy Yard &#8211; Marine Parade Grounds","description":"","url":"https://gridphilly.com/venue/","addres ,"availability":"inStock","validFrom":"2026-09-17T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-03/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T12:00:00-04:00","endDate":"2026-10-03T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"October First Saturday Open House: Turtles!","description":"&lt;p&gt;Meet hatchlings &amp; adult turtles from a local biodiversity lab while learning about their habitat, life cycle, and more!OCTOBER FIRST SATURDAY OPEN HOUSE:Turtles!This First Saturday Open House, meet live turtles from Saint Joseph\\'s University\\'s Biodiversity Lab (including endangered species and hatchlings), use collage to learn about the different kinds of shells animals have, and browse the Wagner\\'s collection of reptile specimens!Grace Roth, Wagner GeoKids Fellow and Lab Manager of Dr. Scott McRobert\\'s Biodiversity Lab at SJU, will give presentations at 1pm and 3pm on turtle life cycles, species differentiation, and what the Wagner\\'s reptile collection can teach us about our&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/17352af4a4445c3576b7e4479fd6bfdf.jpg","url":"https://gridphilly.com/event/october-first-saturday-open-house-turtles/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T12:00:00-04:00","endDate":"2026-10-03T16:00:00-04:00","location":{"@type":"Place","name":"Wagner Free Institute of Science","description":"","url":"https://gridphilly.com/venue/wagner-free-institute-of-science/","address":{"@type":"PostalAddress","streetAddress":"1700 W Montgomery Ave","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19121","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Wagner Free Institute of Science","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Arts and Crafts Supply Swap","description":"&lt;p&gt;Do you have gently used or new art and craft supplies that are collecting dust? Are there things you bought for projects you\\'re never going to get to or lost interest in? Do you want to try a new hobby but need inspiration and means? Let\\'s share materials that are in good condition! The Art Department and Special Collections invite you to come by the library with supplies that you no longer want or need and pick up something else in exchange. You do not need to bring materials to take something. Join us at Parkway Central in the Heim&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Red-and-Green-Illustrated-Craft-Creative-Portfolio-Presentation.png","url":"https://gridphilly.com/event/arts-and-crafts-supply-swap/2026-10-03/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T13:00:00-04:00","endDate":"2026-10-03T15:30:00-04:00","location":{"@type":"Place","name":"(Philadelphia, PA) Parkway Central Library","description":"","url":"https://gridphilly.com/venue/philadelphia-pa-parkway-central-library/","address":{"@type":"PostalAddress","streetAddress":"1901 Vine Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19103","addressCountry":"United States"},"telephone":"0","sameAs":""},"organizer":{"@type":"Person","name":"Free Library of Philadelphia","description":"","url":"http://0","telephone":"0","email":"&#48;","sameAs":"http://0"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/arts-and-crafts-supply-swap/2026-10-03/","category":"primary","availability":"inStock","validFrom":"2026-08-06T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tacony Creek Park Music &amp; Arts Festival","description":"&lt;p&gt;Celebrating Tacony Creek Park with live music and performances spanning the globe, crafts &amp; games, family fun and more!Olney Culture Lab of CultureTrust Greater Philadelphia and Tookany/Tacony-Frankford Watershed Partnership are happy to present the 6th edition of the Tacony Creek Park Music &amp; Arts Festival!The festival returns on Saturday, October 3, 2026 from 1 pm - 5 pm.It will be held at the Big Field in Tacony Creek Park, located on East Olney Avenue at East Clarkson Avenue.(In case of inclement weather, the event will be moved indoors to Grover Washington Jr. Middle School 201 E. Olney Avenue.)There will be&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/b54b8b14c475491d112047bbc51ae1f7.jpg","url":"https://gridphilly.com/event/tacony-creek-park-music-arts-festival-6/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T13:00:00-04:00","endDate":"2026-10-03T17:00:00-04:00","location":{"@type":"Place","name":"East Olney Avenue &amp; East Clarkson Avenue","description":"","url":"https://gridphilly.com/venue/east-olney-avenue-east-clarkson-avenue-2/","address":{"@type":"PostalAddress","streetAddress":"East Olney Avenue &amp; East Clarkson Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19120","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Olney Culture Lab of CultureTrust Greater Phila","description":"","url":"https://olneyculturelab.org/","telephone":"","email":"","sameAs":"https://olneyculturelab.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Crafted &amp; Drafted","description":"&lt;p&gt;An afternoon of craft brews &amp; creativity with block printing your own stationary set taught by Jessica O\u2019NeillArtsi presents\u2026Crafted &amp; Drafted ! \ud83c\udfa8\ud83c\udf7bJoin us at Triple Bottom Brewing on Saturday, October 3 at 2 PM for an afternoon of craft brews and creativity taught by Jessica O\u2019Neill. This time, we\u2019re learning the art of block printing and creating our own stationery sets\u2014perfect for someone special or to pair with your next gift.Bring your friends, grab a drink, and spend the afternoon getting crafty with Artsi!\u2728 All supplies included\u2728 No experience required\u2728 Limited spots in class&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/30337afa7af5b067666d192c421c1e0a.jpg","url":"https://gridphilly.com/event/crafted-drafted/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T14:00:00-04:00","endDate":"2026-10-03T16:00:00-04:00","location":{"@type":"Place","name":"Triple Bottom Brewing","description":"","url":"https://gridphilly.com/venue/triple-bottom-brewing/","address":{"@type":"PostalAddress","streetAddress":"915 Spring Garden Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Artsi","description":"","url":"http://artsiphilly.org","telephone":"","email":"","sameAs":"http://artsiphilly.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"&#8216;Takes a Village Storyhour","description":"&lt;p&gt;Come listen to stories with guest storytellers, crafts, activities, and space for the whole family to gather. led by KokuRoko Learning Co-opBring the whole family to enjoy tales representing Black and Brown peoples, play, and foster community. We invite elders and griots to share stories. This is led by Koku-Roko Learning Co-op, where we gather like-minded families; easing the load of parenting and offering a curious space to explore.Check out our last Story HourMore about Koku-RokoKoku-Roko is a Black and brown-led co-operative space for cultural enrichment and liberated learning. We curate child-centered and family-encouraged educational experiences to support the development&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/07/b4e8585c4c4ae283f7b8c3ea2d30a18d.jpg","url":"https://gridphilly.com/event/takes-a-village-storyhour-18/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T14:00:00-04:00","endDate":"2026-10-03T16:00:00-04:00","location":{"@type":"Place","name":"d&#8217;griot gallery","description":"","url":"https://gridphilly.com/venue/dgriot-gallery/","address":{"@type":"PostalAddress","streetAddress":"51 Maplewood Mall","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"d&#8217;griot philly","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Rythm &amp; Bloom: A Bridge Studio Experience","description":"&lt;p&gt;Rhythm &amp; Bloom: A Bridge Studio Experience is a free, all-ages community event celebrating music, art, creativity, and connection. The afternoon will feature live music and a DJ, create-your-own bouquets, our Community Bloom Wall, face painting, refreshments, and more. The event is presented by The Bridge Studio in partnership with Kensington Community Alliance and supported through Heart of Kensington Creates- Councilwoman Quetcy, Impact and Mural Arts.&lt;/p&gt;\\n","url":"https://gridphilly.com/event/rythm-bloom-a-bridge-studio-experience/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T14:00:00-04:00","endDate":"2026-10-03T17:30:00-04:00","location":{"@type":"Place","name":"The Bridge Studio, 2550 Kensington Avenue, Philadelphia, PA, 19125, United States","description":"","url":"https://gridphilly.com/venue/the-bridge-studio-2550-kensington-avenue-philadelphia-pa-19125-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Shiverfest Fall festival","description":"&lt;p&gt;Every fall, Riverbend Environmental Education Center transforms into a spooooook-tacular family festival. Shiverfest brings together food trucks, live entertainment, animals, crafts, and community, all set against the backdrop of the preserve. Shiverfest is a fundraiser that helps Riverbend provide free and accessible nature education to kids. Every ticket, sponsorship, and donation directly supports that mission. Discounted tickets available for SNAP/EBT/ PA ACCESS cardholders. Email tmountain@riverbendeec.org.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shiverfest2025_Highlights-7-scaled.jpg","url":"https://gridphilly.com/event/shiverfest-fall-festival/2026-10-03/2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T15:00:00-04:00","endDate":"2026-10-03T20:00:00-04:00","location":{"@type":"Place","name":"Riverbend Environmental Education Center","description":"","url":"https://gridphilly.com/venue/riverbend-environmental-education-center/","address":{"@type":"PostalAddress","streetAddress":"1950 Spring Mill Road","addressLocality":"Gladwyne","addressRegion":"PA","postalCode":"19035","addressCountry":"United States"},"telephone":"","sameAs":"https://riverbendeec.org/"},"organizer":{"@type":"Person","name":"Riverbend Environmental Education Center","description":"","url":"https://riverbendeec.org/","telephone":"","email":"","sameAs":"https://riverbendeec.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"l a y e r s","description":"&lt;p&gt;Welcome to l a y e r s! West Philly-based artist, shanina dionna, shares 15 years of making, becoming, + returning through &quot;l a y e r s,&quot; bringing together new + earlier works, tracing what we carry, uncover, + gather over time. This is an invitation to slow down + be. Through painting, film, installation, archival materials, intentional music curation (including a live band), + a new collaboration with a local ceramicist from Artifact Studio, the l a y e r s experience explores identity + belonging while making room for connection, curiosity + encounter. The exhibition will also&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/layers_square_LinkedIn_flyer.jpg","url":"https://gridphilly.com/event/l-a-y-e-r-s/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T18:00:00-04:00","endDate":"2026-10-03T21:00:00-04:00","location":{"@type":"Place","name":"Urban Art Gallery","description":"","url":"https://gridphilly.com/venue/urban-art-gallery/","address":{"@type":"PostalAddress","streetAddress":"262 South 52nd Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19139","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"shanina dionna","description":"","url":"https://www.shaninadionna.com","telephone":"","email":"i&#110;f&#111;&#64;s&#104;anin&#97;dion&#110;&#97;&#46;co&#109;","sameAs":"https://www.shaninadionna.com"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/l-a-y-e-r-s/","category":"primary","availability":"inStock","validFrom":"2026-09-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"de/composition 1.2: Native Trees, Sonic Roots","description":"&lt;p&gt;de/composition 1.2: Native Trees, Sonic Roots is an immersive multimedia performance driven by ambient soundscapes, dynamic visuals, narrative storytelling and movement grounded in ecological stories. Real-time audio converted from the bio-electric inputs of trees and worms are merged with live electronic music and Latin folk percussion. Led by composer and producer June Lopez, alongside narrator and contemporary dance performer Dr. Jam\u00e9 McCray, with visual artists Samara Talkin and Neil Cippon, this evolving performance spotlights the surrounding environment of the Tookany/Tacony\u2013Frankford Watershed. Where: Bennet Compost, 5650 Rising Sun Avenue, Philadelphia, PA 19120 When: Saturday, October 3rd, 2026 @ 7 PM Featuring:&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/55364505621_3b4d8266c7_o-scaled.jpg","url":"https://gridphilly.com/event/de-composition-1-2-native-trees-sonic-roots/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-03T19:00:00-04:00","endDate":"2026-10-03T21:00:00-04:00","location":{"@type":"Place","name":"Bennett Compost","description":"","url":"https://gridphilly.com/venue/bennett-compost/","address":{"@type":"PostalAddress","streetAddress":"5650 Rising Sun Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19120","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Olney Culture Lab of CultureTrust Greater Phila","description":"","url":"https://olneyculturelab.org/","telephone":"","email":"","sameAs":"https://olneyculturelab.org/"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/de-composition-1-2-native-trees-sonic-roots/","category":"primary","availability":"inStock","validFrom":"2026-09-18T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-04/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T00:00:00-04:00","endDate":"2026-10-04T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"b&#101;&#97;&#114;de&#100;&#108;&#97;&#100;&#105;&#101;sc&#97;&#98;ar&#101;&#116;&#64;g&#109;&#97;&#105;l&#46;com","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-04/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Birds, Butterflies, and Dragonflies Walk with Cliff and Nancy Hence (meet at Rt. 420 parking lot)","description":"&lt;p&gt;Take an educational walk with our knowledgeable volunteers Cliff and Nancy Hence! Discover the 300+ species of birds that use the Refuge during their migration routes - each week guarantee different species! Along the way, they will also be looking out for the many species butterflies and dragonflies of the refuge. This event meets at the Rt. 420 parking lot.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-21-at-2.53.35-PM.png","url":"https://gridphilly.com/event/birds-butterflies-and-dragonflies-walk-with-cliff-and-nancy-hence-meet-at-rt-420-parking-lot/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T09:00:00-04:00","endDate":"2026-10-04T11:00:00-04:00","location":{"@type":"Place","name":"John Heinz National Wildlife Refuge","description":"","url":"https://gridphilly.com/venue/john-heinz-national-wildlife-refuge/","address":{"@type":"PostalAddress","streetAddress":"8601 Lindbergh Blvd","addressLocality":"Philadelphia","postalCode":"19153"},"telephone":"","sameAs":"https://natlands.org/venue/john-heinz-national-wildlife-refuge/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Discover the Wissahickon: Hella Pachella Hike","description":"&lt;p&gt;Meeting at Pachella Field (view location on Google Maps) Our\u00a0Discover the Wissahickon hike series is presented by Newrez. Join Trail Ambassadors Dave Bonar, Naomi Leach, Jean McWilliams, and Debra Brackett on a hike that explores the Yellow Trail in the south half of the park. This longer hike will be moderately difficult with some steep elevation changes. Check out a preview of our hike on Komoot below! Parking and Transit: If you\u2019re driving, there\u2019s plenty of space to park onsite.\u00a0Reminder\u00a0to never leave valuables behind in your car! If you\u2019re taking public transit, our location is serviced by the 27 bus.\u00a0See&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/pascale_landscape_2-scaled-SaCC9f.jpg","url":"https://gridphilly.com/event/discover-the-wissahickon-hella-pachella-hike/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T09:00:00-04:00","endDate":"2026-10-04T12:00:00-04:00","location":{"@type":"Place","name":"Pachella Field, 6751 Henry Avenue, Philadelphia, PA, 19128, United States","description":"","url":"https://gridphilly.com/venue/pachella-field-6751-henry-avenue-philadelphia-pa-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Guided Bird Walk","description":"&lt;p&gt;Troy Bynum from TB Wildlife Photography LLC will be hosting a guided bird walk in partnership with the Whitemarsh Foundation.Join us at Dixon Meadow Preserve, located on the corner of Thomas and Flourtown Roads in Whitemarsh Township. With its 14 acres repurposed in 2014 and its boardwalk measuring nearly two-thirds of a mile, the Preserve is a haven for birders, walkers, and those who enjoy the area\u2019s natural flora and fauna. With over 190 species reported on eBird, we\u2019re bound to find something special.Attendees will meet at the parking lot before walking down to the preserve.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/08/d9f1b246215928ecf65acb4f779889c6.jpg","url":"https://gridphilly.com/event/guided-bird-walk-11/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T10:00:00-04:00","endDate":"2026-10-04T12:00:00-04:00","location":{"@type":"Place","name":"548 Flourtown Rd","description":"","url":"https://gridphilly.com/venue/548-flourtown-rd/","address":{"@type":"PostalAddress","streetAddress":"548 Flourtown Road","addressLocality":"Lafayette Hill","addressRegion":"PA","postalCode":"19444","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"TB Wildlife Photography LLC","description":"","url":"https://www.tbwildlifegallery.com/","telephone":"","email":"","sameAs":"https://www.tbwildlifegallery.com/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Help Soapbox Move! Volunteer Work Day","description":"&lt;p&gt;Help the Soapbox prepare for our upcoming move! Volunteer alongside our wonderful community to organize / pack our studio areas &amp; supplies!Hi wonderful Soapbox community; it\\'s almost time for the studio to move to our new home on Baltimore Ave! Thank you so much for your ongoing support and excitement about our moving efforts, here\\'s a chance to help out in a big way!! Registration is optional but gives us an idea of who is going to come through and you\\'ll get an automatic reminder email, so we recommend registering! Join us any time between 10-4pm on our upcoming Volunteer&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/06/454deabf07e2abdde72509737c189525.jpg","url":"https://gridphilly.com/event/help-soapbox-move-volunteer-work-day-3/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T10:00:00-04:00","endDate":"2026-10-04T15:00:00-04:00","location":{"@type":"Place","name":"The Soapbox: Community Print Shop &amp; Zine Library","description":"","url":"https://gridphilly.com/venue/the-soapbox-community-print-shop-zine-library-8/","address":{"@type":"PostalAddress","streetAddress":"4700 Kingsessing Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19143","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"The Soapbox: Community Print Shop &amp; Zine Library","description":"","url":"http://www.phillysoapbox.org","telephone":"","email":"","sameAs":"http://www.phillysoapbox.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Houseplant Migration","description":"&lt;p&gt;Prepare to move your houseplants inside for the winter.Learn when and how to bring your houseplants indoors \u2013 and most importantly, how to prevent pests from coming in with them!\u00a0&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/5b24c53a73ba0723976ae1502e67f4aa.jpg","url":"https://gridphilly.com/event/houseplant-migration/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T11:00:00-04:00", "@context":"http://schema.org","@type":"Event","name":"Monarch Butterly Celebration and Sustainability Fair","description":"&lt;p&gt;Join us on Sunday, October 4, for a Monarch Butterfly Celebration and Sustainability Fair in the Jenkintown Town Square from 11:30 a.m. to 1:30 p.m. We\\'ll have a presentation on the Monarch Butterfly at 12:30, followed by a butterfly tag &amp; release (conditions permitting) as part of the Monarch Watch Tagging Program. The Monarch Watch Tagging Program is a large-scale community science project initiated in 1992 to help understand the dynamics of the monarch\\'s spectacular fall migration through mark and recapture. Info at monarchwatch.org Representatives from Bird Town PA, Back to Earth Compost Crew, Fox Chase Cancer Center, Tookany/Tacony-Frankford Watershed&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Monarch-Butterfly-Celebration-Sustainability-Fair-2026-.png","url":"https://gridphilly.com/event/monarch-butterly-celebration-and-sustainability-fair/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T11:30:00-04:00","endDate":"2026-10-04T13:30:00-04:00","location":{"@type":"Place","name":"Jenkintown Town Square","description":"","url":"https://gridphilly.com/venue/jenkintown-town-square/","address":{"@type":"PostalAddress","streetAddress":"Greenwood Ave &amp; Leedom St","addressLocality":"Jenkintown","postalCode":"19046","addressCountry":"United States"},"telephone":"215-885-0700","sameAs":"https://jenkintownboro.com"},"organizer":{"@type":"Person","name":"Jenkintown Environmental Advisory Committee","description":"","url":"https://jenkintownboro.com/environmental-advisory-committee/","telephone":"215-885-0700","email":"&#67;&#111;&#110;&#116;&#97;&#99;&#116;&#74;E&#65;&#67;&#64;&#103;ma&#105;l&#46;c&#111;&#109;","sameAs":"https://jenkintownboro.com/environmental-advisory-committee/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-04/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T12:00:00-04:00","endDate":"2026-10-04T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"These Shining Lives by Melanie Marnich at The Stagecrafters Theater","description":"&lt;p&gt;Four young women meet and forge a bond while working a well-paying job in 1920s rural Illinois, for the Radium Dial Company. Years later, as they realize that the work has compromised their health, they bravely choose to hold the firm accountable. The Stagecrafters Theater 8130 Germantown Ave, Chestnut Hill, Philadelphia PA 19118 \u25cf Friday and Saturday, September 18-19 @ 7:30pm (musical performance before opening night) \u25cf Sunday, September 20 @ 2pm (with a panel discussion to follow the performance) \u25cf Thursday, Friday and Saturday, September 24-26 @ 7:30pm \u25cf Thursday, Friday and Saturday, October 1-3 @ 7:30pm \u25cf Sunday,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shining_postcard.jpg","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-04/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T14:00:00-04:00","endDate":"2026-10-04T15:30:00-04:00","location":{"@type":"Place","name":"The Stagecrafters Theater","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"8130 Germantown Ave","addressLocality":"Philadelphia","addressRegion":"P","postalCode":"19118","addressCountry":"United States"},"telephone":"2152479913","sameAs":"https://thestagecrafters.org/"},"organizer":{"@type":"Person","name":"The Stagecrafters Theater","description":"","url":"https://www.thestagecrafters.org","telephone":"2152479913","email":"jt&#111;cz&#101;&#107;&#64;&#116;&#104;e&#115;t&#97;gecra&#102;&#116;ers.o&#114;g","sameAs":"https://www.thestagecrafters.org"},"offers":{"@type":"Offer","price":"26 \u2013 30","priceCurrency":"USD","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-04/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Monthly Cobbs Creek Park Trash Clean Up","description":"&lt;p&gt;Join the Philadelphia Mycology Club for some community oriented land stewardship in Cobbs Creek Park! Meet in the parking lot at Thomas Ave along Cobbs Creek Parkway at 2pm. We will provide everything you need. Everyone is invited! For questions, you can reach out to us at admin@phillymycoclub.com. Join us on the first Sunday of every month at the same time and location for our community volunteer event! Let us know you\u2019re coming to lend a hand by clicking here By registering for this event you grant the Philadelphia Mycology Club to use photographs and/or video of you taken at&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/B9CD365F-8B5A-43F2-AA20-798E10B7E630_1_201_a-mT8t71.jpg","url":"https://gridphilly.com/event/monthly-cobbs-creek-park-trash-clean-up/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T14:00:00-04:00","endDate":"2026-10-04T16:00:00-04:00","location":{"@type":"Place","name":"Cobbs Creek Park","description":"","url":"https://gridphilly.com/venue/cobbs-creek-park/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":"https://phillymycoclub.com/venue/cobbs-creek-park/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Black Farmers Market: NIGHTMARKET","description":"&lt;p&gt;Come vibe, taste, shop + celebrate the harvest at NIGHTMARKET\u2014where abundance comes alive under the garden lights.UPDATED DATE &amp; TIME: SATURDAY OCTOBER 3RD, 6-9:00PMBlack Farmers Market: NIGHTMARKETA Fall Equinox + Harvest Celebration Under the Garden LightsAs the season turns one last time, we\u2019re gathering again \u2014 this time after dark.Join Get Fresh Daily for NIGHTMARKET, a special evening edition of the Black Farmers Market celebrating the Fall Equinox, the harvest season, and the abundance we\u2019ve built together all year long.Freedom Greens + Garden will glow after sunset as farmers, makers, artists, neighbors, and friends come together for an evening of&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/c9854f94c87ec7181dfa2f4bc69aa09d.jpg","url":"https://gridphilly.com/event/black-farmers-market-nightmarket/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-04T18:00:00-04:00","endDate":"2026-10-04T22:00:00-04:00","location":{"@type":"Place","name":"Freedom Greens + Gardens","description":"","url":"https://gridphilly.com/venue/freedom-greens-gardens/","address":{"@type":"PostalAddress","streetAddress":"5200 Pine Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19143","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Get Fresh Daily","description":"","url":"http://www.getfreshdaily.org","telephone":"","email":"","sameAs":"http://www.getfreshdaily.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Morning Wellness Walks at Awbury","description":"&lt;p&gt;Awbury\u2019s 56-acre landscape tucked away in Germantown is a serene escape from the fast pace of the city of Philadelphia. Join us on our Wellness Walks and immerse yourself in nature as we take a moderately paced stroll through gardens, woodlands, roam around the farm, and our ponds and meadows. Join us Mondays &amp; Thursdays from 7:00 am \u2013 8:00 am at The Farm at Awbury for our Wellness Walks led by wellness coordinator Megan Do Nascimento! Questions? Contact our Wellness Walk coordinate\u00a0Megan Do Nascimento\u00a0at\u00a0wellness@awbury.org.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/12/Screen-Shot-2025-12-26-at-3.07.23-PM.png","url":"https://gridphilly.com/event/morning-wellness-walks-at-awbury/2026-10-05/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T07:00:00-04:00","endDate":"2026-10-05T08:00:00-04:00","location":{"@type":"Place","name":"The Farm at Awbury Arboretum","description":"","url":"https://gridphilly.com/venue/the-farm-at-awbury-arboretum/","address":{"@type":"PostalAddress","streetAddress":"6336 Ardleigh Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19138","addressCountry":"United States"},"telephone":"0","sameAs":"awbury.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Serpentine Barrens Tour with Willistown Township","description":"&lt;p&gt;Join Natural Lands and our partners Willistown Township staff to learn about this unique ecosystem. We&#8217;ll be taking a guided tour of the Serpentine Barrens at Serpentine &amp; Willisbrook Preserves, hosted by expert Willisbrook Preserve Manager Erin Smith. Designed for Willistown Township residents and neighbors, this tour introduces the rare ecosystems that come alive each autumn with unique native plants and wildlife. Erin will share the geological history of the barrens, highlight the specialized species that depend on it, and discuss ongoing conservation efforts for this important natural habitat. For ages 12 and up. Space is limited &#8211; participants must&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/NaturalLandsAdam-Hribar-medium-e1741274192254-xFs4DE.jpg","url":"https://gridphilly.com/event/serpentine-barrens-tour-with-willistown-township/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T10:00:00-04:00","endDate":"2026-10-05T11:30:00-04:00","location":{"@type":"Place","name":"Willisbrook Preserve","description":"&lt;p&gt;Willisbrook Preserve is a 126 acre mix of woods and grassland meadows, including just over 20 acres of a rare ecosystem known as the Sugartown Serpentine Barrens. These barrens support a variety of plant species, many of which are threatened or endangered. parking Please park at the paved parking lot located at the Greater Chester Valley Soccer Association fields on Line Road, 7/10 mile northwest of Boot Road. If that parking lot is closed, there is a gravel parking lot at\u00a0Willistown Township\u2019s Serpentine Preserve, 143 Line Road, Malvern, PA 19355. visitor hours Open daily, dawn to dusk. more preserve information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/willisbrook-preserve/","address":{"@type":"PostalAddress","streetAddress":"Titans Cricket Ground, 110 Line Rd","addressLocality":"Malvern","addressRegion":"Pennsylvania","postalCode":"19355"},"telephone":"","sameAs":"https://www.natlands.org/visit/willisbrook-preserve/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Hands On Youth Cooking Class","description":"&lt;p&gt;Join us for our youth library cooking class this month! On the first Monday of every month, NKCDC\u2019s Nourish team is at Kensington Library for a FREE youth cooking class! Ages 5-18 welcome, one adult required for each child 5-7 years old!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Orange-Cooking-Class-Flyer-1-ClczQy.png","url":"https://gridphilly.com/event/hands-on-youth-cooking-class/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T15:00:00-04:00","endDate":"2026-10-05T17:00:00-04:00","location":{"@type":"Place","name":"Kensington Library, 104 W Dauphin St., Philadelphia, Pennsylvania, 19134","description":"","url":"https://gridphilly.com/venue/kensington-library-104-w-dauphin-st-philadelphia-pennsylvania-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Getting Sports Fans into the Climate Game","description":"&lt;p&gt;Join PCSSM &amp; EcoAthletes for an event on sports and climate action!On Opening Night of Climate Week at Penn on Monday, October 5 from 5:30-7pm, join EcoAthletes, the Penn Center for Science, Sustainability and the Media (PCSSM), and Penn Climate for a panel discussion with current and former Penn athletes moderated by Dr. Michael Mann on how athletes can help accelerate a climate comeback by promoting environmental and climate action to millions of sports fans around the world.About EcoAthletes EcoAthletes is a US-based, 501(c)(3) nonprofit with the mission to \u201cinspire and coach athletes to lead climate action\u201d. It works to&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/3e77232f01bd5e1ecbebe61da3e433cb.jpg","url":"https://gridphilly.com/event/getting-sports-fans-into-the-climate-game/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T17:30:00-04:00","endDate":"2026-10-05T19:00:00-04:00","location":{"@type":"Place","name":"3160 Chestnut St","description":"","url":"https://gridphilly.com/venue/3160-chestnut-st/","address":{"@type":"PostalAddress","streetAddress":"3160 Chestnut Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Penn Center for Science, Sustainability &amp;the Media","description":"","url":"https://web.sas.upenn.edu/pcssm/","telephone":"","email":"","sameAs":"https://web.sas.upenn.edu/pcssm/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"SNBL General Meeting","description":"&lt;p&gt;Somerset Neighbors for Better Living is the civic organization for the neighborhood that between Aramingo, Lehigh and Kensington Avenues, and Clearfield Street. Except for holidays, they meet the first Monday of the month at Firm Hope Baptist Church. (When the first Monday is a holiday, they meet the second Monday.) Learn more on Facebook.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/SNBL-logo-YV19YD.jpg","url":"https://gridphilly.com/event/snbl-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T18:30:00+00:00","endDate":"2026-10-05T20:00:00+00:00","location":{"@type":"Place","name":"Firm Hope Baptist Church, 2313 E Auburn Street, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/firm-hope-baptist-church-2313-e-auburn-street-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Makers Monday","description":"&lt;p&gt;Join a community of makers and artists to to work on your work in progress or learn a new skill from a variety of skill sets.Event Title: Makers MondayLocation: Utility Works - 32 east Baltimore Ave. Lansdowne, PAJoin a vibrant community of makers and artists to bring your creative projects to life or learn something new! Whether you\\'re working on a personal project or looking to explore fresh skills, this is the perfect opportunity to collaborate, create, and grow.All are welcome to show up without an RSVPEvent Highlights:Work on Your Current Project: Bring your in-progress creations and receive feedback, support,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2024/12/becdeb0cc97cd0a665f287cb2d05ff1a.jpg","url":"https://gridphilly.com/event/makers-monday-38/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-05T19:00:00-04:00","endDate":"2026-10-05T22:00:00-04:00","location":{"@type":"Place","name":"Utility Works","description":"","url":"https://gridphilly.com/venue/utility-works/","address":{"@type":"PostalAddress","streetAddress":"32 East Baltimore Avenue","addressLocality":"Lansdowne","addressRegion":"PA","postalCode":"19050","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"LEDC / Utility Works","description":"","url":"http://utility.works","telephone":"","email":"","sameAs":"http://utility.works"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Fall Bird Walk","description":"&lt;p&gt;The diverse gardens of Stoneleigh sustain a variety of migratory birds during their autumn journeys. Flycatchers, orioles, thrushes, and warblers wing their way across the garden, stopping to fuel up during their journeys. Bring a pair of binoculars and get ready for an exclusive, early&#8211;morning, guided experience as we look and listen for birds in the tranquility of the garden before it opens to the general public.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/DSC_4798-palm-warbler-john-heinz-10-15-22-bill-moses-medium-e1741194171723-TrGaM4.jpg","url":"https://gridphilly.com/event/fall-bird-walk-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-06T08:00:00-04:00","endDate":"2026-10-06T10:00:00-04:00","location":{"@type":"Place","name":"Stoneleigh: &lt;em&gt;a natural garden&lt;/em&gt;","description":"&lt;p&gt;Stoneleigh is the public garden of nonprofit Natural Lands. The garden provides joy and well-being for thousands of guests every year through inspiring displays of native plants that support local ecology in a magnificent former Main Line estate. parking There is a 63-car asphalt parking lot at the main entrance to the garden at 1829 East County Line Road, Villanova, PA 19085. guest hours Tuesday &#8211; Sunday, 10:00 AM to 5:00 PM. Closed Mondays. more garden information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/stoneleigh-a-natural-garden-2/","address":{"@type":"PostalAddress","streetAddress":"1829 County Line Road","addressLocality":"Villanova","addressRegion":"Pennsylvania","postalCode":"19085"},"telephone":"610-353-5587 x200","sameAs":"https://www.natlands.org/stoneleigh/visit/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":
