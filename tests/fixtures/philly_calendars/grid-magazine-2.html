[{"@context":"http://schema.org","@type":"Event","name":"Image Par Image Collage Workshop","description":"&lt;p&gt;Join artist Natasha Guy for a workshop that will use collage as a way to explore historical images. 2026 marks not just the 250th anniversary of the Declaration of Independence, but also the 200th anniversary of photography. In honor of these celebrations, participants will use historical images from the Print and Picture Collection to compose a collage and discuss what they\\'ve made as a group, exploring topics like how a city pictures itself, how photographs build collective memory, and the ways that history can be reopened through collage. The workshop will be held in the Art Department at Parkway Central&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Collage-workshop-1-scaled.jpg","url":"https://gridphilly.com/event/image-par-image-collage-workshop/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-06T17:00:00-04:00","endDate":"2026-10-06T19:30:00-04:00","location":{"@type":"Place","name":"Parkway Central Library","description":"","url":"https://gridphilly.com/venue/parkway-central-library/","address":{"@type":"PostalAddress","streetAddress":"1901 Vine Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19103","addressCountry":"United States"},"telephone":"","sameAs":"http://www.jlphiladelphia.org"},"organizer":{"@type":"Person","name":"Free Library of Philadelphia","description":"","url":"http://0","telephone":"0","email":"&#48;","sameAs":"http://0"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/image-par-image-collage-workshop/","category":"primary","availability":"inStock","validFrom":"2026-09-24T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Celebrate 40 Years of Share Food Philly \u2013\u00a0Party in the Warehouse!","description":"&lt;p&gt;40 Years of Feeding Communities Since 1986, Share Food Program has been committed to nourishing our neighbors. A lot has changed in 40 years, but one thing remains the same: food is a human right and Share is here to feed hungry neighbors no matter what. From pandemics to recessions, and natural disasters to national tragedies, there\u2019s no storm we haven\u2019t weathered together. Hunger has grown, but so have we, and we\u2019re as committed as ever to expanding access to fresh, healthy food for all. Our work\u2014and your partnership\u2014has never been more important. \u00a0You can help us end hunger, for&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-24-at-4.49.14-PM-e1790283321176.png","url":"https://gridphilly.com/event/celebrate-40-years-of-share-food-philly-party-in-the-warehouse/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-06T17:30:00-04:00","endDate":"2026-10-06T20:00:00-04:00","location":{"@type":"Place","name":"Share Food Warehouse","description":"","url":"https://gridphilly.com/venue/share-food-warehouse/","address":{"@type":"PostalAddress","streetAddress":"2901 W Hunting Park Ave","addressLocality":"Philadelphia","postalCode":"19129","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Share Food Program","description":"","url":"https://www.sharefoodprogram.org","telephone":"0","email":"&#48;","sameAs":"https://www.sharefoodprogram.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-07/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T00:00:00-04:00","endDate":"2026-10-07T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"b&#101;&#97;&#114;&#100;&#101;dladiesca&#98;aret&#64;gmai&#108;&#46;c&#111;&#109;","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-07/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tusculum Garden Guided Gardening Hours","description":"","url":"https://gridphilly.com/event/tusculum-garden-guided-gardening-hours-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T10:00:00-04:00","endDate":"2026-10-07T11:00:00-04:00","location":{"@type":"Place","name":"Tusculum Gateway Garden, 2715 Kensington Avenue, Philadelphia, PA, 19134","description":"","url":"https://gridphilly.com/venue/tusculum-gateway-garden-2715-kensington-avenue-philadelphia-pa-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Little Explorers: Destination Hibernation!","description":"&lt;p&gt;Find out what it takes to get ready to sleep for the whole winter. &nbsp; ABOUT LITTLE EXPLORERS: Every first Wednesday of the month, March through November, 10-11:30am. Join us for exploration, a garden walk, and stories! Please feel free to bring a snack. Designed for toddlers and preschoolers, ages 2-4. One adult chaperone is required for every two children. For more information, email Leslie Gale, lgale@bartramsgarden.org. &nbsp;&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/09/Meeting-a-Turtle-fj6hDz.jpg","url":"https://gridphilly.com/event/little-explorers-destination-hibernation/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T10:00:00-05:00","endDate":"2026-10-07T11:30:00-05:00","location":{"@type":"Place","name":"Bartram\u2019s Garden Courtyard, Coach House and Barn","description":"","url":"https://gridphilly.com/venue/bartrams-garden-courtyard-coach-house-and-barn/","address":{"@type":"PostalAddress","streetAddress":"5400 Lindbergh Blvd.","addressLocality":"Philadelphia","postalCode":"19143","addressCountry":"United States"},"telephone":"215-729-5281","sameAs":"www.bartramsgarden.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"The Abundant Life of Dead and Dying Trees","description":"&lt;p&gt;Most people are familiar with the innumerable benefits of living trees. But, even after their death, trees provide vital habitat, shelter, and food for wildlife. Join us as we learn how dead and dying trees still teem with life, from tiny termites to fantastic flying squirrels and everything in between. This program will begin inside with a lecture and discussion, and then move outside to explore how Stoneleigh incorporates snags and logs into the garden.\u00a0\u00a0\u00a0 This program is presented in conjunction with Morris Arboretum and has been approved to carry 2.5 CEUs from ISA, LA CES, and the New Jersey&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Fox-sRGB-16-2-e1756134519898-eACFf6.jpg","url":"https://gridphilly.com/event/the-abundant-life-of-dead-and-dying-trees/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T10:30:00-04:00","endDate":"2026-10-07T12:30:00-04:00","location":{"@type":"Place","name":"Stoneleigh: &lt;em&gt;a natural garden&lt;/em&gt;","description":"&lt;p&gt;Stoneleigh is the public garden of nonprofit Natural Lands. The garden provides joy and well-being for thousands of guests every year through inspiring displays of native plants that support local ecology in a magnificent former Main Line estate. parking There is a 63-car asphalt parking lot at the main entrance to the garden at 1829 East County Line Road, Villanova, PA 19085. guest hours Tuesday &#8211; Sunday, 10:00 AM to 5:00 PM. Closed Mondays. more garden information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/stoneleigh-a-natural-garden-2/","address":{"@type":"PostalAddress","streetAddress":"1829 County Line Road","addressLocality":"Villanova","addressRegion":"Pennsylvania","postalCode":"19085"},"telephone":"610-353-5587 x200","sameAs":"https://www.natlands.org/stoneleigh/visit/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Sen Bill Cassidy: Finding a Bipartisan Path Forward on Environmental Policy","description":"&lt;p&gt;Join us for a special event with Senator Bill CassidyJoin Perry World House for a special event with Senator Bill Cassidy that explores the nexus of environmental policy, national security, energy, the economy, and the challenge of building bipartisan consensus on these critical issues.At a time of deep political polarization, durable policymaking can seem out of reach. Yet the costs of energy and the growing economic and national security challenge posed by China underscore the need for policies that can withstand changes in political leadership.Is the U.S. political system capable of solving big problems? The conversation will explore whether the&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/2fb41b1c7d8c20b1830e8bae750d66f9.jpg","url":"https://gridphilly.com/event/sen-bill-cassidy-finding-a-bipartisan-path-forward-on-environmental-policy/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T11:00:00-04:00","endDate":"2026-10-07T12:00:00-04:00","location":{"@type":"Place","name":"Perry World House","description":"","url":"https://gridphilly.com/venue/perry-world-house/","address":{"@type":"PostalAddress","streetAddress":"3803 Locust Walk","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Perry World House","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Voter Information","description":"&lt;p&gt;Ahead of the November 4 election, we invite you to join us for Voter Information!Whether you\\'re voting for the first time or simply want to be prepared, this event will provide the information and resources you need to vote with confidence.What to expect:View a sample ballotFind your polling locationComplete a voting pledge and reminder cardExplore voter education resources from regional partnersEnjoy family-friendly activitiesDate: Wednesday, October 7Time: 11:00 AM \u2013 3:00 PMLocation: St. Barnabas Community Resource Center6006 W. Girard Avenue, Philadelphia, PAThis event is free and open to the community. Stop by anytime during the event to get informed, ask questions,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/10/96eed1561121e7810033f72ac0768f0a.jpg","url":"https://gridphilly.com/event/voter-information/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T11:00:00-04:00","endDate":"2026-10-07T15:00:00-04:00","location":{"@type":"Place","name":"ECS St Barnabas Community Resource Center","description":"","url":"https://gridphilly.com/venue/ecs-st-barnabas-community-resource-center/","address":{"@type":"PostalAddress","streetAddress":"6006 West Girard Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19151","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"St. Barnabas Community Resource Center","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tree Drawing for Beginners Workshop Series","description":"&lt;p&gt;Join artist Henry Martin for this four-session class designed for anyone who enjoys the natural world and wants to explore it more deeply through drawing. This is a basic drawing class based on nature highlighting\u2014but not limited to\u2014trees. The first week will focus on paying attention to our perceptions through common artists\u2019 exercises. In the second week, we\u2019ll analyze the structure of the plants we will draw. The remaining weeks will allow us to explore the fun and joy we can experience with drawing, with opportunities for self-directed focus and subjects.\u00a0\u00a0\u00a0 Series Dates: October 7, 14, 21, &amp; 28 required&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/IMG_5049-e1756134320421-pqQLgS.jpg","url":"https://gridphilly.com/event/tree-drawing-for-beginners-workshop-series/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T14:00:00-04:00","endDate":"2026-10-07T17:00:00-04:00","location":{"@type":"Place","name":"Stoneleigh: &lt;em&gt;a natural garden&lt;/em&gt;","description":"&lt;p&gt;Stoneleigh is the public garden of nonprofit Natural Lands. The garden provides joy and well-being for thousands of guests every year through inspiring displays of native plants that support local ecology in a magnificent former Main Line estate. parking There is a 63-car asphalt parking lot at the main entrance to the garden at 1829 East County Line Road, Villanova, PA 19085. guest hours Tuesday &#8211; Sunday, 10:00 AM to 5:00 PM. Closed Mondays. more garden information&lt;/p&gt;\\n","url":"https://gridphilly.com/venue/stoneleigh-a-natural-garden-2/","address":{"@type":"PostalAddress","streetAddress":"1829 County Line Road","addressLocality":"Villanova","addressRegion":"Pennsylvania","postalCode":"19085"},"telephone":"610-353-5587 x200","sameAs":"https://www.natlands.org/stoneleigh/visit/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Future of Climate Finance: The Capital Stack for the Energy Transition","description":"&lt;p&gt;Join us for Climate Week at Penn and learn about what it takes to fund a more affordable, cleaner, and healthier future.Climate finance is usually discussed in trillions and pledges. On the ground, the transition in emerging markets gets built by entrepreneurs: solar distributors, cold-chain operators, agri-processors, waste companies, all running real businesses with real customers. Leslie Labruto maps the capital available to them, from catalytic philanthropy and concessional debt to DFI money, venture equity, and commercial lending, and shows where each type works, where it stalls, and who gets left out. Drawing on her work building Resolve and more&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/a5e872af3629319b49baac27103af826.jpg","url":"https://gridphilly.com/event/future-of-climate-finance-the-capital-stack-for-the-energy-transition/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T16:00:00-04:00","endDate":"2026-10-07T17:00:00-04:00","location":{"@type":"Place","name":"Kleinman Center for Energy Policy","description":"","url":"https://gridphilly.com/venue/kleinman-center-for-energy-policy/","address":{"@type":"PostalAddress","streetAddress":"220 S. 34th St., University of Pennsylvania","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Kleinman Center for Energy Policy","description":"","url":"http://www.kleinmanenergy.upenn.edu","telephone":"","email":"","sameAs":"http://www.kleinmanenergy.upenn.edu"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"An Alchemical Affair: A &#8216;Fire and Gold&#8217; Opening Celebration","description":"&lt;p&gt;Before there was chemistry, there was chymistry, and before there was chymistry, there was alchemy!Join us as we unveil our newest permanent exhibition, Fire and Gold: The Art of Alchemy (1450\u20131850). You\u2019ll be transported back in time through one of the largest collections of alchemical art in the world. Get a glimpse into the past, when alchemists sought to uncover nature\u2019s \u201csecrets\u201d by exploring the transformation of matter through experimentation, secrecy, and coded language. Fire and Gold takes visitors on a journey from underground mines into cluttered workshops and fiery laboratories through remarkable paintings and rare books from the 15th&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/c5898454f5b79d8e2ead98235120687e.jpg","url":"https://gridphilly.com/event/an-alchemical-affair-a-fire-and-gold-opening-celebration/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T17:00:00-04:00","endDate":"2026-10-07T20:00:00-04:00","location":{"@type":"Place","name":"Science History Institute","description":"","url":"https://gridphilly.com/venue/science-history-institute/","address":{"@type":"PostalAddress","streetAddress":"315 Chestnut Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19106","addressCountry":"United States"},"telephone":"","sameAs":"https://www.sciencehistory.org"},"organizer":{"@type":"Person","name":"Science History Institute","description":"","url":"https://www.sciencehistory.org/","telephone":"","email":"","sameAs":"https://www.sciencehistory.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Radical Ecologies: A Talk with Jeff Richards","description":"&lt;p&gt;Presented by the Association for Public Art in collaboration with DesignPhiladelphiaGet to know architect and Temple University professor Jeff Richards and his innovative work with flax and \u201cflaxcrete\u201d as a sustainable building material. The exploration of flaxcrete\u2019s potential is at the heart of Franklin Thread, his 2026 Art on the Parkway project commissioned by the Association for Public Art and now on view in Maja Park. Richards developed flaxcrete, a biogenic material, in collaboration with students at Temple University\u2019s Tyler School of Art and Architecture.JEFF RICHARDS is an architect and educator at Temple University\u2019s Tyler School of Art and Architecture,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/20dc74e3d4443a8a81bfe3205021cfc5.jpg","url":"https://gridphilly.com/event/radical-ecologies-a-talk-with-jeff-richards/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T18:00:00-04:00","endDate":"2026-10-07T20:00:00-04:00","location":{"@type":"Place","name":"Village of Industry &amp; Art","description":"","url":"https://gridphilly.com/venue/village-of-industry-art-8/","address":{"@type":"PostalAddress","streetAddress":"320 South Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19102","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Association for Public Art","description":"","url":"http://associationforpublicart.org","telephone":"","email":"","sameAs":"http://associationforpublicart.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Intro to Machine Sewing- Set The Table","description":"&lt;p&gt;Learn sewing machine basics and create a set of table placemats and cloth napkins!Learn sewing machine basics and create placemats and napkins for your table!Join STITCH AND DESTROY for their popular into to machine sewing workshop!STITCH AND DESTROY owners, Haven and Corey, will guide you through on how to use a sewing machine. We will go over sewing machine parts, threading the machine, and how to sew basic straight and zig zag stitches. After practicing with the machine, Haven and Corey will teach you how to sew cloth napkins and placemats using these basic stitches. Pinning fabric and ironing will&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/0553d935493d6525746d4ee664a48289.jpg","url":"https://gridphilly.com/event/intro-to-machine-sewing-set-the-table/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-07T18:00:00-04:00","endDate":"2026-10-07T21:00:00-04:00","location":{"@type":"Place","name":"523 S 4th St","description":"","url":"https://gridphilly.com/venue/523-s-4th-st/","address":{"@type":"PostalAddress","streetAddress":"523 South 4th Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19147","addressCountry":"United States"},"telephone":"","sameAs":"https://www.stitchanddestroy.com/"},"organizer":{"@type":"Person","name":"STITCH AND DESTROY","description":"","url":"https://www.stitchanddestroy.com/","telephone":"","email":"","sameAs":"https://www.stitchanddestroy.com/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Thursday Volunteer Service Day","description":"&lt;p&gt;Meeting Location TBD Parking:\u00a0TBD Bathrooms:\u00a0TBD Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join Friends of the Wissahickon staff, Crew Leaders, and Trail Ambassadors in a variety of stewardship tasks! All are welcome to attend, and no experience is needed. We encourage attendees to work within their own comfort level, and we always strive to accommodate needs on an individual basis. With that being said, this service day may include the following activities: \u2022 Trail work: using long-handled tools for digging, raking, and scraping; moving heavy objects \u2022 Planting site preparation: using long&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/fowearthday2025-thegraylens-19-scaled-fSeVgV.jpg","url":"https://gridphilly.com/event/thursday-volunteer-service-day-66/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T09:00:00-04:00","endDate":"2026-10-08T12:00:00-04:00","performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Leaf &#038; Learn","description":"&lt;p&gt;At our Leaf &amp; Learn program, kids ages 2-5 can get their first taste of volunteering for a good cause! In a supportive atmosphere, they\\'ll show care for the park with easy, age-appropriate tasks. This includes things like planting seeds, picking up small pieces of trash with kid-sized grabbers, and &quot;feeding&quot; a worm farm with shredded paper. By being part of this volunteer group, kids will learn that they are an important member of a community that helps keep their neighborhood clean and green. The group will meet at the FDR Park Learning Garden. Enter at the Broad Street entrance&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Leaf-and-Learn-2026.png","url":"https://gridphilly.com/event/leaf-learn-4/2026-10-08/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T10:00:00-04:00","endDate":"2026-10-08T11:00:00-04:00","location":{"@type":"Place","name":"FDR Park","description":"","url":"https://gridphilly.com/venue/fdr-park/","address":{"@type":"PostalAddress","streetAddress":"South Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19145","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Friends of FDR Park","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Introduction to Nature Journaling with Tiffaney Datillo","description":"&lt;p&gt;Participants will explore the joy and benefits of nature journaling while connecting with nature at Newlin Grist Mill.In this one hour program, participants will explore the joy and benefits of nature journaling. While connecting with nature at the beautiful and historic Newlin Grist Mill , we will discuss focused observation, journaling styles, entering observations, drawing skills, combining observation and research, meditative journaling and seasonal and travel nature journaling.Participants are welcome to bring their own journals and supplies if they wish but these will be provided as part of the workshop to those that need them.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/41eb42c04a5745619e3957a3cd7dfe87.jpg","url":"https://gridphilly.com/event/introduction-to-nature-journaling-with-tiffaney-datillo/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T11:00:00-04:00","endDate":"2026-10-08T12:00:00-04:00","location":{"@type":"Place","name":"Newlin Grist Mill Park","description":"","url":"https://gridphilly.com/venue/newlin-grist-mill-park/","address":{"@type":"PostalAddress","streetAddress":"219 Cheyney Road","addressLocality":"Concord Township","addressRegion":"PA","postalCode":"19342","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Newlin Grist Mill","description":"","url":"https://newlingristmill.org/","telephone":"","email":"","sameAs":"https://newlingristmill.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-08/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T12:00:00-04:00","endDate":"2026-10-08T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Happy Hour at Newlin Grist Mill","description":"&lt;p&gt;Beer garden, food truck, live music Succession Fermentory will be at the park on Thursday evenings in September and October for weekly pop-up happy hours with a variety of beers and other beverages for sale. Stop by to sip some drinks, play games, and relax by the creek with friends. A great way to unwind after work or a walk in the park! Thursdays, 5-8PM, September &amp; October&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-01-at-9.49.03-AM.png","url":"https://gridphilly.com/event/happy-hour-at-newlin-grist-mill/2026-10-08/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T17:00:00-04:00","endDate":"2026-10-08T20:00:00-04:00","location":{"@type":"Place","name":"Newlin Grist Mill","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"219 Cheyney Road","addressLocality":"Glen Mills","postalCode":"19342","addressCountry":"United States"},"telephone":"610-459-2359","sameAs":"https://newlingristmill.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026  Experience the Estuary Celebration","description":"&lt;p&gt;Celebrating PDE\u2019s Pearl Anniversary \u2014 30 Years of Protecting the Delaware EstuaryCelebrate 30 years of protecting the Delaware Estuary at the 2026 Experience the Estuary Celebration, the Partnership for the Delaware Estuary\u2019s signature annual gathering of regional environmental leaders, partners, and supporters.This year\u2019s Pearl Anniversary celebration honors three decades of science, collaboration, and community impact across the Delaware River and Bay. Guests will enjoy an unforgettable evening of great food, meaningful connections, and opportunities to support the estuary we all depend on.Join us on Thursday, October 8, 2026, from 5:00 to 8:30 p.m. at Vie by Cescaphe in Philadelphia, PA.The&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/c968036502cf591651cc252c16fd6018.jpg","url":"https://gridphilly.com/event/2026-experience-the-estuary-celebration/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T17:00:00-04:00","endDate":"2026-10-08T20:30:00-04:00","location":{"@type":"Place","name":"Vie by Cescaphe","description":"","url":"https://gridphilly.com/venue/vie-by-cescaphe/","address":{"@type":"PostalAddress","streetAddress":"600 North Broad St","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19130","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Partnership for the Delaware Estuary","description":"","url":"https://www.delawareestuary.org","telephone":"","email":"","sameAs":"https://www.delawareestuary.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"SEW TECH &#8211; 201","description":"&lt;p&gt;Learn advanced machine techniques and try out different equipment, tools and stitches!Know the basics of sewing and want to level up your stitching game?! We got you covered! In our Sew Tech 201 workshop, we\u2019ll give you a crash course on what your sewing machine can do and how to perfect your craft. Learn about different sewing needle types and threads, and how to match these to the fabric you are sewing. We\u2019ll also test out presser feet, like a bias binding foot, roller foot, non-stick teflon foot, couching foot, and the hump jumper. Seam finishes, hems, installing a zipper&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/f8c1986dd8e070987a574aa7582771c8.jpg","url":"https://gridphilly.com/event/sew-tech-201/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T18:00:00-04:00","endDate":"2026-10-08T21:00:00-04:00","location":{"@type":"Place","name":"523 S 4th St","description":"","url":"https://gridphilly.com/venue/523-s-4th-st/","address":{"@type":"PostalAddress","streetAddress":"523 South 4th Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19147","addressCountry":"United States"},"telephone":"","sameAs":"https://www.stitchanddestroy.com/"},"organizer":{"@type":"Person","name":"STITCH AND DESTROY","description":"","url":"https://www.stitchanddestroy.com/","telephone":"","email":"","sameAs":"https://www.stitchanddestroy.com/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Stitch and Bitch at Natural Creativity","description":"&lt;p&gt;A relaxed evening of sewing, mending, and good company on the 2nd Thursday of the month. Bring a project or start one. All skill levels weBring whatever you\\'ve been meaning to finish \u2014 the hem you\\'ve been ignoring, the quilt top in the closet, the jacket that needs a patch \u2014 and spend an evening making progress in good company.Hand sewing, machine sewing, knitting, crochet, embroidery, mending. Whatever you\\'re working on, bring it.Henry leads the sewing and fabric arts program at Natural Creativity, and on the first Thursday of each month he\\'s opening the studio. You\\'ll have sewing machines, a&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/934d75e8bebc776eec226dbf27df4f89.jpg","url":"https://gridphilly.com/event/stitch-and-bitch-at-natural-creativity/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T18:30:00-04:00","endDate":"2026-10-08T20:30:00-04:00","location":{"@type":"Place","name":"3820 The Oak Rd","description":"","url":"https://gridphilly.com/venue/3820-the-oak-rd/","address":{"@type":"PostalAddress","streetAddress":"3820 The Oak Road","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19129","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Natural Creativity","description":"","url":"https://www.naturalcreativity.org","telephone":"","email":"","sameAs":"https://www.naturalcreativity.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Science and Solutions for a Clean Ocean","description":"&lt;p&gt;Attend this virtual session to learn how to protect our lakes, rivers, and oceans with National Geographic Explorer Rachael Z. Miller!Science and solutions for a clean ocean, lakes and rivers!If you look for our trash, derelict fishing gear and microplastic in any aquatic environment, you will find it. This pollution is nearly ubiquitous and making its way through the marine and human food web - and onto our plates and into our bodies. National Geographic Explorer and Explorers Club Fellow Rachael Z. Miller is working to keep both macro and microplastic out of our public waterways. Rachael and her team&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/7f465fc1a129a79b1ce83c24be27fa54.jpg","url":"https://gridphilly.com/event/science-and-solutions-for-a-clean-ocean/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-08T19:00:00-04:00","endDate":"2026-10-08T20:00:00-04:00","organizer":{"@type":"Person","name":"Haverford College Arboretum","description":"","url":"https://www.haverford.edu/arboretum","telephone":"","email":"","sameAs":"https://www.haverford.edu/arboretum"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-09/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-09T00:00:00-04:00","endDate":"2026-10-09T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"&#98;&#101;&#97;rde&#100;la&#100;i&#101;sc&#97;b&#97;re&#116;&#64;gm&#97;i&#108;&#46;&#99;om","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-09/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Senator Saval Satellite Office Hours","description":"&lt;p&gt;On the 2nd Friday of every month, we\u2019ll be joined by the office of Senator Saval\u2019s Office at 2515 Frankford Avenue from 9am-12pm to support with property tax/rent rebate applications, SEPTA senior passes, utility assistance, unemployment compensation, CHIP and SNAP benefits, PennDOT, Birth and Death certificates, state agencies, and more!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/2026-Mobile-Office-Hours-Template_FLYER.pdf-2-1yxKdl.png","url":"https://gridphilly.com/event/senator-saval-satellite-office-hours/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-09T09:00:00-04:00","endDate":"2026-10-09T12:00:00-04:00","location":{"@type":"Place","name":"2515 Frankford Avenue, 2515 Frankford Avenue, Philadelphia, Pennsylvania","description":"","url":"https://gridphilly.com/venue/2515-frankford-avenue-2515-frankford-avenue-philadelphia-pennsylvania/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-09/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-09T12:00:00-04:00","endDate":"2026-10-09T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Cure Violence Kensington Friday Drop-In Hours","description":"&lt;p&gt;Our weekly Drop-In Center is a safe, judgment-free space to come as you are. You can grab coffee and food, play games, and connect with people who understand what you\u2019re going through. If you\u2019ve been caught up in street life, recently came home, or just need real support and a place to stay grounded\u2014you belong here. We can connect you to:\u00a0 Housing and utility assistance\u00a0 ID and personal documents\u00a0 Employment opportunities Legal support Food &amp; Clothing Stop by for an intake and see how we can support you and your needs. Contact Cure Violence at 215-427-0350&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Cure-Violence-Drop-in-Flyer-2KioR9.png","url":"https://gridphilly.com/event/cure-violence-kensington-friday-drop-in-hours-3/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-09T14:00:00-04:00","endDate":"2026-10-09T16:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"These Shining Lives by Melanie Marnich at The Stagecrafters Theater","description":"&lt;p&gt;Four young women meet and forge a bond while working a well-paying job in 1920s rural Illinois, for the Radium Dial Company. Years later, as they realize that the work has compromised their health, they bravely choose to hold the firm accountable. The Stagecrafters Theater 8130 Germantown Ave, Chestnut Hill, Philadelphia PA 19118 \u25cf Friday and Saturday, September 18-19 @ 7:30pm (musical performance before opening night) \u25cf Sunday, September 20 @ 2pm (with a panel discussion to follow the performance) \u25cf Thursday, Friday and Saturday, September 24-26 @ 7:30pm \u25cf Thursday, Friday and Saturday, October 1-3 @ 7:30pm \u25cf Sunday,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shining_postcard.jpg","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-09/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-09T19:30:00-04:00","endDate":"2026-10-09T21:00:00-04:00","location":{"@type":"Place","name":"The Stagecrafters Theater","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"8130 Germantown Ave","addressLocality":"Philadelphia","addressRegion":"P","postalCode":"19118","addressCountry":"United States"},"telephone":"2152479913","sameAs":"https://thestagecrafters.org/"},"organizer":{"@type":"Person","name":"The Stagecrafters Theater","description":"","url":"https://www.thestagecrafters.org","telephone":"2152479913","email":"&#106;t&#111;&#99;&#122;ek&#64;&#116;h&#101;&#115;&#116;&#97;ge&#99;ra&#102;&#116;ers.&#111;&#114;&#103;","sameAs":"https://www.thestagecrafters.org"},"offers":{"@type":"Offer","price":"26 \u2013 30","priceCurrency":"USD","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-09/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Discover the Wissahickon: Meadow Miler Hike","description":"&lt;p&gt;Meeting at Northwestern Avenue and Forbidden Drive\u00a0(view location on Google Maps) Our\u00a0Discover the Wissahickon hike series is presented by Newrez. Join Trail Ambassadors Chris Unander, Sue Amon, Bailey Graf, and Reagan Hedlund on a trek through every meadow Wissahickon Valley Park has to offer! We\u2019ll travel through Harper\u2019s Meadow, Houston Meadow, and Andorra Meadow. This will be a moderately difficult hike with some steep elevation changes. Check out a preview of our hike on Komoot below! Parking and Transit:\u00a0If you\u2019re driving, there is plenty of parking in the Northwestern Avenue Parking Area near our meeting location, as well as additional&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2024/09/Marian-Racette-meadow-hike-spring-jpeg-nnGsaS.tmp_.webp","url":"https://gridphilly.com/event/discover-the-wissahickon-meadow-miler-hike/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T08:00:00-04:00","endDate":"2026-10-10T12:30:00-04:00","location":{"@type":"Place","name":"Forbidden Drive at Northwestern Avenue, Forbidden Drive and Northwestern Avenue, Philadelphia, PA, 19128, United States","description":"","url":"https://gridphilly.com/venue/forbidden-drive-at-northwestern-avenue-forbidden-drive-and-northwestern-avenue-philadelphia-pa-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Saturday Planting at Red Covered Bridge","description":"&lt;p&gt;Meeting at Thomas Mill Red Covered Bridge (8901 Forbidden Drive) Parking:\u00a0There\u2019s parking near the Chestnut Hill Avenue Trailhead and in the parking lots at Bells Mill Road. Both options will require 10-15 minute walk to the work site, so please plan your travel time accordingly.\u00a0See map for details. Bathrooms:\u00a0None Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join us in the park for a native planting at the Thomas Mill Red Covered Bridge! All are welcome to attend, and no experience is needed. We encourage attendees to work within their own comfort level,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/FOWPlantingdDay10.4-thegraylens-27-scaled-n3u3qR.jpg","url":"https://gridphilly.com/event/saturday-planting-at-red-covered-bridge/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T09:00:00-04:00","endDate":"2026-10-10T12:00:00-04:00","location":{"@type":"Place","name":"Thomas Mill Covered Bridge, 8901 Forbidden Drive, Philadelphia, PA, 19118, United States","description":"","url":"https://gridphilly.com/venue/thomas-mill-covered-bridge-8901-forbidden-drive-philadelphia-pa-19118-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Herbalism Workshop Series at FDR Park","description":"&lt;p&gt;We\u2019ve made a few updates to the dates for our free Herbalism 101 workshop series with Majesty! Join us as we explore wild herbs and plants and learn about their medicinal and nutritional properties. Come learn, explore, and connect with the plants growing around us! Meet: Guard House / Main Office Time: 10:00 AM Workshop Dates: September 19 October 3, 10, 17, 24, 31 These free classes were made possible with support from the DCNR.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Herbalism.jpeg","url":"https://gridphilly.com/event/herbalism-workshop-series-at-fdr-park/2026-10-10/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T10:00:00-04:00","endDate":"2026-10-10T11:00:00-04:00","location":{"@type":"Place","name":"FDR Park Welcome Center","description":"","url":"https://gridphilly.com/venue/fdr-park-welcome-center/","address":{"@type":"PostalAddress","streetAddress":"1500 Pattison Avenue &amp;, S Broad St,","addressLocality":"Philadelphia","postalCode":"19145","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Friends of FDR Park","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Discover the Wissahickon: Orange Trail Outing","description":"&lt;p&gt;Meeting at Valley Green Inn (view location on Google Maps) Our\u00a0Discover the Wissahickon hike series is presented by Newrez. Join Trail Ambassadors Sheryl Rose, Andrea DeSabto, and Doug Gibson on a hike along Orange Trail and Forbidden Drive. Along the way, we\u2019ll pass some of the Park\u2019s most iconic landmarks, including Devil\u2019s Pool, Glen Fern House, Fingerspan Bridge, and several WPA structures. This moderately difficult hike includes a large staircase, a rocky stream crossing, and several narrow sections of trail where steady footing is a must. Check out a preview of our hike on Komoot below! Parking and Transit: If&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/05/Fingerspan-iIQxHQ.jpg","url":"https://gridphilly.com/event/discover-the-wissahickon-orange-trail-outing/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T10:00:00-04:00","endDate":"2026-10-10T12:00:00-04:00","location":{"@type":"Place","name":"Valley Green Inn, Valley Green Road, Philadelphia, 19128, United States","description":"","url":"https://gridphilly.com/venue/valley-green-inn-valley-green-road-philadelphia-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Tour the Rail Park!","description":"&lt;p&gt;Join one of our expert guides for a small group tour that traverses through the heart of Philadelphia and connects the city\u2019s industrial past with its green future. The Three Mile Vision Tour explores the past, present, and future of the Rail Park, highlighting the potential for this project to connect thousands of Philadelphia residents and visitors to green space and each other. This linear, street-level tour is approximately 3 miles in length, beginning at 2700 Pennsylvania Avenue and ending at Phase One of the Rail Park at 1100 Callowhill Street. We do not loop back to the starting point.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/RailParkTours.avif","url":"https://gridphilly.com/event/tour-the-rail-park-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T10:00:00-04:00","endDate":"2026-10-10T12:00:00-04:00","location":{"@type":"Place","name":"The Rail Park","description":"","url":"https://gridphilly.com/venue/the-rail-park/","address":{"@type":"PostalAddress","streetAddress":"1125 Callowhill St, Philadelphia, PA 19123","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"}, tps://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Philadelphia Open Studio Tours","description":"&lt;p&gt;Mark your calendars for October 2026, as The Center for Emerging Visual Artists (CFEVA) proudly presents the Annual Philadelphia Open Studio Tours (POST). This acclaimed event stands as Philadelphia\u2019s premier fall visual arts festival, offering an exclusive behind-the-scenes look into the creative processes of 150+ local artists working in an array of visual media: painting, drawing, ceramics, mixed media, photography, metalworking, and much more. Embark on self-guided tours through artist studios and dynamic workspaces, where you can witness artists at work firsthand. Dive into a diverse array of activities including hands-on workshops, gallery exhibitions, live demonstrations, engaging artist talks, special&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/POST-2026-COVER.jpg","url":"https://gridphilly.com/event/philadelphia-open-studio-tours/2026-10-10/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T12:00:00-04:00","endDate":"2026-10-10T18:00:00-04:00","location":{"@type":"Place","name":"Philadelphia Open Studio Tours","description":"","url":"https://gridphilly.com/venue/philadelphia-open-studio-tours/","address":{"@type":"PostalAddress","streetAddress":"3600 Market Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"2155467775","sameAs":"https://www.cfeva.org/philaopenstudios"},"organizer":{"@type":"Person","name":"The Center for Emerging Visual Artists (CFEVA)","description":"","url":"","telephone":"","email":"","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/philadelphia-open-studio-tours/2026-10-10/","category":"primary","availability":"inStock","validFrom":"2026-09-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Book Release Party for She Was Wild Grass by Katie Bennett","description":"&lt;p&gt;Join us at The Perch for the launch of West Philly writer Katie Bennett\\'s debut memoir, SHE WAS WILD GRASS!Please join H&amp;H Books and The Perch for the release party for She Was Wild Grass by Katie Bennett. There will be snacks (BYOB!), karaoke, and readings by Katie and friends: Steph Cawley, Hannah Bonner, and Sam Heaps. Tickets are free, and registration is highly recommended to help us gauge expected attendance. You can also preorder a copy of She Was Wild Grass with your ticket and pick it up at the launch.H&amp;H Books will have copies of the authors\\' books&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/c184b89f3a307ba6d193ec5040d0f18a.jpg","url":"https://gridphilly.com/event/book-release-party-for-she-was-wild-grass-by-katie-bennett/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-10T19:00:00-04:00","endDate":"2026-10-10T21:00:00-04:00","location":{"@type":"Place","name":"The Perch Music &amp; Arts Workshop","description":"","url":"https://gridphilly.com/venue/the-perch-music-arts-workshop-2/","address":{"@type":"PostalAddress","streetAddress":"2321 Emerald Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19125","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"The Head &amp; The Hand","description":"","url":"http://theheadandthehand.com","telephone":"","email":"","sameAs":"http://theheadandthehand.com"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-11/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-11T00:00:00-04:00","endDate":"2026-10-11T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"b&#101;&#97;rde&#100;&#108;a&#100;&#105;esc&#97;ba&#114;et&#64;g&#109;a&#105;l&#46;com","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-11/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Philly Birding Weekend: John Heinz National Wildlife Refuge","description":"&lt;p&gt;Time Sunday, October 11 8 \u2013 10am EDT Location John Heinz National Wildlife Refuge 8601 Lindbergh Blvd. Philadelphia, PA 19153 About this event Join us for Philly Birding Weekend\\'s tour of John Heinz National Wildlife Refuge at Tinicum. Once part of a 5,000-acre expanse of tidal marsh where Lenape communities fished and gathered, Tinicum Marsh was steadily diked and drained by European settlers beginning in the 1600s. By the late 1960s, the marsh\\'s remaining acres faced a new threat from a proposed highway and landfill, prompting local citizens to organize and successfully petition Congress for its protection. In 1972, that&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-24-at-2.55.36-PM.png","url":"https://gridphilly.com/event/philly-birding-weekend-john-heinz-national-wildlife-refuge/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-11T08:00:00-04:00","endDate":"2026-10-11T10:00:00-04:00","location":{"@type":"Place","name":"John Heinz National Wildlife Refuge, 8601 Lindbergh Blvd., Philadelphia, Pennsylvania, 19153, United States","description":"","url":"https://gridphilly.com/venue/john-heinz-national-wildlife-refuge-8601-lindbergh-blvd-philadelphia-pennsylvania-19153-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Audubon Mid-Atlantic","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Restoration Walks at Newlin Grist Mill","description":"&lt;p&gt;Select Sundays at 9:30 AM: September 13, October 11, and November 8, 2026 Join former Chester County Trails Club Vice President Dolores (Dee) McGrath for a three-mile hike through a historic area, ending with 10 minutes of quietly enjoying the sounds of nature. Hike includes some elevation. Hiking boots or sturdy shoes are recommended, and please remember to
