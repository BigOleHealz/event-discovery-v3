,"url":"","telephone":"","email":"","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/philadelphia-open-studio-tours/2026-10-11/","category":"primary","availability":"inStock","validFrom":"2026-09-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Family Art Day","description":"&lt;p&gt;Bring the whole family for a fun, creative afternoon at the Pennsylvania Academy of the Fine Arts (PAFA). Family Art Day is a completely free, all-ages event designed to get everyone making art together. Enjoy our monthly make &amp; take art activity\u2014perfect for budding artists of all ages. Explore the Museum, try out new materials, and take home your very own creation. \u2702\ufe0f Artmaking starts at 1 PM \ud83c\udf9f\ufe0f Pre-registration is required \ud83d\uddbc\ufe0f Free Museum admission included Come make something special with us! Admission to the museum is included with this free program; advance registration is required.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/07/Family-Art-Day.jpeg","url":"https://gridphilly.com/event/family-art-day-5/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-11T13:00:00-04:00","endDate":"2026-10-11T15:00:00-04:00","location":{"@type":"Place","name":"Pennsylvania Academy of the Fine Arts","description":"","url":"https://gridphilly.com/venue/pennsylvania-academy-of-the-fine-arts/","address":{"@type":"PostalAddress","streetAddress":"118-128 North Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19102","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Pennsylvania Academy of the Fine Arts","description":"","url":"","telephone":"(215) 972-7600","email":"&#105;n&#102;o&#64;&#112;af&#97;.&#111;&#114;&#103;","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/family-art-day-5/","category":"primary","availability":"inStock","validFrom":"2026-08-06T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Foray at Ridley Creek State Park","description":"&lt;p&gt;This event is free and open to everyone. The PMC is funded entirely through donations. If you are able, please consider making a donation via PayPal using our email address:\u00a0info@phillymycoclub.com. Thank you! Register Here Meet us at\u00a0Picnic Area 9\u00a0at 1pm. After a brief introduction we will break apart to look for mushrooms. If it is your first time and/or you feel like you need guidance you will be able to follow more experienced members. At 3pm we will all meet back at the starting point to identify and talk about what we found and have a little picnic. Feel free&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/45FF17EB-16D8-4059-850D-0EB7A2F48E32-uGtYau.jpg","url":"https://gridphilly.com/event/foray-at-ridley-creek-state-park/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-11T13:00:00-04:00","endDate":"2026-10-11T16:00:00-04:00","location":{"@type":"Place","name":"White Trl, Glen Mills, PA 19342","description":"","url":"https://gridphilly.com/venue/white-trl-glen-mills-pa-19342/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Snipes Farm Fall Events: The Italian Bee","description":"&lt;p&gt;Have you ever wondered what it takes to be a beekeeper? Curious about bees and what you can do to help them and other pollinators in your yard? Meet Suzanne and Michael Luciano, Master Beekeepers and winners of this year\u2019s Grange Fair! Come get a sneak peek into the complicated and amazing lives of honey bees! Come away with resource information on the challenges of beekeeping, the rewarding hobby of stewarding honey bees, and a plant list for pollinators! Beeswax, beekeeping tools, and Honey from the Farm will be on display, and hopefully an observation hive of live bees too!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Copy-of-Fall-Events-The-Italian-Bee.png","url":"https://gridphilly.com/event/snipes-farm-fall-events-the-italian-bee/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-11T14:00:00-04:00","endDate":"2026-10-11T16:00:00-04:00","location":{"@type":"Place","name":"Snipes Farm","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"890 W Bridge Street","addressLocality":"Morrisville","addressRegion":"PA","postalCode":"19067","addressCountry":"United States"},"telephone":"(215) 295-1138","sameAs":"https://www.snipesfarm.org/"},"organizer":{"@type":"Person","name":"Snipes Farm and Education Center","description":"","url":"https://snipesfarm.org/","telephone":"(215) 295-1138","email":"tuck&#101;rm&#64;&#115;ni&#112;&#101;&#115;f&#97;r&#109;.or&#103;","sameAs":"https://snipesfarm.org/"},"offers":{"@type":"Offer","price":"10","priceCurrency":"USD","url":"https://gridphilly.com/event/snipes-farm-fall-events-the-italian-bee/","category":"primary","availability":"inStock","validFrom":"2026-08-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Morning Wellness Walks at Awbury","description":"&lt;p&gt;Awbury\u2019s 56-acre landscape tucked away in Germantown is a serene escape from the fast pace of the city of Philadelphia. Join us on our Wellness Walks and immerse yourself in nature as we take a moderately paced stroll through gardens, woodlands, roam around the farm, and our ponds and meadows. Join us Mondays &amp; Thursdays from 7:00 am \u2013 8:00 am at The Farm at Awbury for our Wellness Walks led by wellness coordinator Megan Do Nascimento! Questions? Contact our Wellness Walk coordinate\u00a0Megan Do Nascimento\u00a0at\u00a0wellness@awbury.org.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2025/12/Screen-Shot-2025-12-26-at-3.07.23-PM.png","url":"https://gridphilly.com/event/morning-wellness-walks-at-awbury/2026-10-12/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-12T07:00:00-04:00","endDate":"2026-10-12T08:00:00-04:00","location":{"@type":"Place","name":"The Farm at Awbury Arboretum","description":"","url":"https://gridphilly.com/venue/the-farm-at-awbury-arboretum/","address":{"@type":"PostalAddress","streetAddress":"6336 Ardleigh Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19138","addressCountry":"United States"},"telephone":"0","sameAs":"awbury.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Kensington Business Coalition Meeting","description":"&lt;p&gt;The Kensington Business Coalition is a group of local business owners who are committed to the growth and safety of Kensington. Monthly meetings bring together business owners, city officials, police, business service providers, and community partners. Meetings include discussion on issues facing local business, information on assistance programs for business owners, and opportunities to interact with police.\u00a0 Interpretation is available as needed. Any business owner is welcome to attend!\u00a0&lt;/p&gt;\\n","url":"https://gridphilly.com/event/kensington-business-coalition-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-13T10:00:00-04:00","endDate":"2026-10-13T11:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Plant Power Hour","description":"&lt;p&gt;Join us for a weekly plant power hour every Tuesday from 5PM-6PM at the Kensington Engagement Center! Each week we\u2019ll be highlighting a new plant and providing seeds for use in your own garden. Eat a snack, make a friend, and learn about a new plant every week at our Plant Power Hour!&lt;/p&gt;\\n","url":"https://gridphilly.com/event/plant-power-hour-3/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-13T17:00:00-04:00","endDate":"2026-10-13T19:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"HistoricalSociety of Frankford October Monthly Meeting and Lecture","description":"&lt;p&gt;Sam Katz, president of History Making Productions, will make a video presentation at the Historical Society of Frankford\u2019s monthly meeting and lecture on Tuesday, October 13, 2026 at7:30 PM. He will present episode 7, &quot;Renewal&quot;, of his series Philadelphia and the Making of America. The film explores Philadelphia from 1925 to 1963, a period shaped by the Great Depression, World War II, political transformation, and ambitious efforts to remake the city. Through stories of Albert M. Greenfield, shifting political power, racial discrimination in housing and employment, and the rise of urban renewal, the episode examines who benefited from Philadelphia\u2019s reinvention&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Sam-Katz-2026-photo.png","url":"https://gridphilly.com/event/historicalsociety-of-frankford-october-monthly-meeting-and-lecture/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-13T19:00:00-04:00","endDate":"2026-10-13T20:30:00-04:00","location":{"@type":"Place","name":"Frankford Historical Society","description":"","url":"https://gridphilly.com/venue/frankford-historical-society/","address":{"@type":"PostalAddress","streetAddress":"1507 Orthodox St","addressLocality":"Philadelphia","postalCode":"19124","addressCountry":"United States"},"telephone":"","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/historicalsociety-of-frankford-october-monthly-meeting-and-lecture/","category":"primary","availability":"inStock","validFrom":"2026-09-17T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-14/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-14T00:00:00-04:00","endDate":"2026-10-14T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"b&#101;a&#114;d&#101;dl&#97;&#100;ie&#115;&#99;&#97;ba&#114;&#101;&#116;&#64;&#103;&#109;a&#105;&#108;.&#99;&#111;m","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-14/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"First-Time Homebuyer Workshops","description":"&lt;p&gt;NKCDC Housing Counselors hold both remote and in-person homebuyer workshops for first-time home buyers in Philadelphia. Whether you\u2019re thinking about buying your first home or trying to remember all the steps from the last time, this is the class for you! The first-time homebuyer class is also approved to qualify you for most down payment assistance programs. Sign up for one of our Workshops here.&lt;/p&gt;\\n","url":"https://gridphilly.com/event/first-time-homebuyer-workshops-2/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-14T09:30:00-04:00","endDate":"2026-10-14T13:30:00-04:00","location":{"@type":"Place","name":"2515 Frankford Avenue, 2515 Frankford Avenue, Philadelphia, Pennsylvania","description":"","url":"https://gridphilly.com/venue/2515-frankford-avenue-2515-frankford-avenue-philadelphia-pennsylvania/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"More Than a Game: Connections and Community in Women\u2019s Sports","description":"&lt;p&gt;How do the stories we inherit shape the paths that we choose? Join the Historical Society of Pennsylvania for a conversation with Valerie Still, a WNBA Hall of Famer, author, and direct descendant of William Still, widely regarded as the Father of the Underground Railroad. Drawing on both her family\u2019s legacy and her career as a professional basketball player, Still will reflect on how the stories of those who came before us continue to shape our understanding of resilience, perseverance, and representation. Still will be joined by the Philadelphia Sisters Sports Group and ESPN award-winning TV play-by-play commentator and analyst&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-17-at-3.05.19-PM.png","url":"https://gridphilly.com/event/more-than-a-game-connections-and-community-in-womens-sports/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-14T18:30:00-04:00","endDate":"2026-10-14T20:00:00-04:00","location":{"@type":"Place","name":"Historical Society of Pennsylvania","description":"","url":"https://gridphilly.com/venue/historical-society-of-pennsylvania/","address":{"@type":"PostalAddress","streetAddress":"1300 Locust Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19107","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Historical Society of Pennsylvania","description":"","url":"http://www.hsp.org","telephone":"","email":"","sameAs":"http://www.hsp.org"},"offers":{"@type":"Offer","price":"10","priceCurrency":"USD","url":"https://gridphilly.com/event/more-than-a-game-connections-and-community-in-womens-sports/","category":"primary","availability":"inStock","validFrom":"2026-09-17T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"SOPO General Meeting","description":"&lt;p&gt;South Port Richmond Civic Association serves the area bounded by the Delaware River, the Lehigh Viaduct, Frankford Avenue, and Allegheny Avenue. Meetings usually last one hour. The public is encouraged to attend.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/SOPO-1-pi00f5.jpg","url":"https://gridphilly.com/event/sopo-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-14T19:00:00+00:00","endDate":"2026-10-14T20:30:00+00:00","location":{"@type":"Place","name":"Veteran Boxers Association Ring 1, 2733 E. Clearfield Street, Philadelphia, 19134","description":"","url":"https://gridphilly.com/venue/veteran-boxers-association-ring-1-2733-e-clearfield-street-philadelphia-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Thursday Volunteer Service Day","description":"&lt;p&gt;Meeting Location TBD Parking:\u00a0TBD Bathrooms:\u00a0TBD Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join Friends of the Wissahickon staff, Crew Leaders, and Trail Ambassadors in a variety of stewardship tasks! All are welcome to attend, and no experience is needed. We encourage attendees to work within their own comfort level, and we always strive to accommodate needs on an individual basis. With that being said, this service day may include the following activities: \u2022 Trail work: using long-handled tools for digging, raking, and scraping; moving heavy objects \u2022 Planting site preparation: using long&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/fowearthday2025-thegraylens-19-scaled-fSeVgV.jpg","url":"https://gridphilly.com/event/thursday-volunteer-service-day-67/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T09:00:00-04:00","endDate":"2026-10-15T12:00:00-04:00","performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Leaf &#038; Learn","description":"&lt;p&gt;At our Leaf &amp; Learn program, kids ages 2-5 can get their first taste of volunteering for a good cause! In a supportive atmosphere, they\\'ll show care for the park with easy, age-appropriate tasks. This includes things like planting seeds, picking up small pieces of trash with kid-sized grabbers, and &quot;feeding&quot; a worm farm with shredded paper. By being part of this volunteer group, kids will learn that they are an important member of a community that helps keep their neighborhood clean and green. The group will meet at the FDR Park Learning Garden. Enter at the Broad Street entrance&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Leaf-and-Learn-2026.png","url":"https://gridphilly.com/event/leaf-learn-4/2026-10-15/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T10:00:00-04:00","endDate":"2026-10-15T11:00:00-04:00","location":{"@type":"Place","name":"FDR Park","description":"","url":"https://gridphilly.com/venue/fdr-park/","address":{"@type":"PostalAddress","streetAddress":"South Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19145","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Friends of FDR Park","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-15/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T12:00:00-04:00","endDate":"2026-10-15T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Happy Hour at Newlin Grist Mill","description":"&lt;p&gt;Beer garden, food truck, live music Succession Fermentory will be at the park on Thursday evenings in September and October for weekly pop-up happy hours with a variety of beers and other beverages for sale. Stop by to sip some drinks, play games, and relax by the creek with friends. A great way to unwind after work or a walk in the park! Thursdays, 5-8PM, September &amp; October&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-01-at-9.49.03-AM.png","url":"https://gridphilly.com/event/happy-hour-at-newlin-grist-mill/2026-10-15/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T17:00:00-04:00","endDate":"2026-10-15T20:00:00-04:00","location":{"@type":"Place","name":"Newlin Grist Mill","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"219 Cheyney Road","addressLocality":"Glen Mills","postalCode":"19342","addressCountry":"United States"},"telephone":"610-459-2359","sameAs":"https://newlingristmill.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"PRNA General Meeting","description":"&lt;p&gt;Port Richmond Neighborhood Action is a group of neighbors and business owners who work together for changes and improvements such as neighborhood safety, beautification and social activities. Learn more on Facebook. To confirm meeting time and location, contact 215-900-9313 or portrichmondna@gmail.com. \u00a0&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot_20240304_143330_Gmail-BBqPdR.jpg","url":"https://gridphilly.com/event/prna-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T17:30:00+00:00","endDate":"2026-10-15T18:30:00+00:00","location":{"@type":"Place","name":"The Block Church 2537 e Monmouth st Philadelphia Pa 19134, 2537 e Monmouth st, Philadelphia, 19134","description":"","url":"https://gridphilly.com/venue/the-block-church-2537-e-monmouth-st-philadelphia-pa-19134-2537-e-monmouth-st-philadelphia-19134/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Port Richmond Neighborhood Association","description":"","url":"","telephone":"","email":"po&#114;tr&#105;&#99;hmo&#110;d&#110;a&#64;&#103;&#109;a&#105;l&#46;&#99;o&#109;","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Horizons: American Landscapes from Tradition to Tomorrow","description":"&lt;p&gt;Join us for an illuminating conversation between curators from two of America\\'s most distinguished art institutions as part of PAFA\\'s landmark exhibition A Nation of Artists. Dr. Lea Stephenson, Kenneth R. Woodcock Curator of Historical American Art at PAFA, and Kerry Bickford, Associate Curator at the Brandywine Museum of Art, explore how American artists have depicted landscapes\u2014from the Hudson River School\\'s sublime vistas to the Brandywine tradition\\'s intimate terrain, and contemporary artists reimagining these spaces today. This dialogue examines how landscape painting has shaped American cultural identity across centuries, reflecting changing relationships with the land, environment, and national mythology. Drawing&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/07/Screenshot-2026-07-29-154107.png","url":"https://gridphilly.com/event/horizons-american-landscapes-from-tradition-to-tomorrow/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-15T18:00:00-04:00","endDate":"2026-10-15T20:00:00-04:00","location":{"@type":"Place","name":"Pennsylvania Academy of the Fine Arts","description":"","url":"https://gridphilly.com/venue/pennsylvania-academy-of-the-fine-arts/","address":{"@type":"PostalAddress","streetAddress":"118-128 North Broad Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19102","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"Pennsylvania Academy of the Fine Arts","description":"","url":"","telephone":"(215) 972-7600","email":"i&#110;f&#111;&#64;pa&#102;&#97;&#46;org","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/horizons-american-landscapes-from-tradition-to-tomorrow/","category":"primary","availability":"inStock","validFrom":"2026-08-31T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-16/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-16T00:00:00-04:00","endDate":"2026-10-16T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"bea&#114;ded&#108;&#97;&#100;ies&#99;a&#98;&#97;re&#116;&#64;&#103;&#109;a&#105;l&#46;&#99;o&#109;","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-16/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Now I Wanna Sniff Some Glue 2: An International Wheatpaste Art Show","description":"&lt;p&gt;Now I Wanna Sniff Some Glue 2 is the second edition of our beloved international wheatpaste show &amp; THE event for wheatpaste artists to meet, exchange ideas &amp; share their love for the art form. With over 200 artists from 15+ countries submitting pieces for the first edition, we\u2019re once again bringing together some of the best wheatpaste art from around the world, right here at Tattooed Mom. The show celebrates the international community that pastes on the streets and reaches out to artists all over the world to show their paste up art in all mediums on our walls,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/NIWSSG2-show-LARGE.jpg","url":"https://gridphilly.com/event/now-i-wanna-sniff-some-glue-2-an-international-wheatpaste-art-show/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-16T00:00:00-04:00","endDate":"2026-10-17T23:59:59-04:00","location":{"@type":"Place","name":"Tattooed Mom","description":"","url":"https://gridphilly.com/venue/tattooed-mom/","address":{"@type":"PostalAddress","streetAddress":"530 South Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19147","addressCountry":"United States"},"telephone":"0","sameAs":""},"organizer":{"@type":"Person","name":"Tattooed Mom","description":"","url":"https://www.tattooedmomphilly.com/","telephone":"215-238-9880","email":"&#116;&#97;&#116;&# -In Hours","description":"&lt;p&gt;Our weekly Drop-In Center is a safe, judgment-free space to come as you are. You can grab coffee and food, play games, and connect with people who understand what you\u2019re going through. If you\u2019ve been caught up in street life, recently came home, or just need real support and a place to stay grounded\u2014you belong here. We can connect you to:\u00a0 Housing and utility assistance\u00a0 ID and personal documents\u00a0 Employment opportunities Legal support Food &amp; Clothing Stop by for an intake and see how we can support you and your needs. Contact Cure Violence at 215-427-0350&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Cure-Violence-Drop-in-Flyer-2KioR9.png","url":"https://gridphilly.com/event/cure-violence-kensington-friday-drop-in-hours-4/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-16T14:00:00-04:00","endDate":"2026-10-16T16:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"H &#038; H Books Presents: Authors Kristen Millares Young and Minda Honey","description":"&lt;p&gt;Touring the East Coast for her memoir Desire Lines, novelist and journalist Kristen Millares Young will appear with memoirist Minda Honey at H&amp;H Books on Friday, October 16 at 7 PM. Mapping the trajectory from struggle to self-determination, Kristen and Minda will each read briefly from their books before discussing the many paths to liberation. Audience participation is most welcome; a Q&amp;A and book signing will follow the authors\\' discussion. Registration is free and highly recommended.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Kristen-Millares-Young.png","url":"https://gridphilly.com/event/h-h-books-presents-authors-kristen-millares-young-and-minda-honey/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-16T19:00:00-04:00","endDate":"2026-10-16T20:30:00-04:00","location":{"@type":"Place","name":"H&amp;H Books","description":"","url":"https://gridphilly.com/venue/hh-books/","address":{"@type":"PostalAddress","streetAddress":"2230 Frankford Ave","addressLocality":"Philadelphia","addressRegion":"NY","postalCode":"19125","addressCountry":"United States"},"telephone":"","sameAs":"www.theheadandthehand.com"},"organizer":{"@type":"Person","name":"H&amp;H Books","description":"","url":"http://www.theheadandthehand.com","telephone":"","email":"&#106;&#101;&#110;n&#105;f&#101;r.&#108;.mil&#116;&#111;n&#64;&#103;&#109;&#97;i&#108;.&#99;o&#109;","sameAs":"http://www.theheadandthehand.com"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/h-h-books-presents-authors-kristen-millares-young-and-minda-honey/","category":"primary","availability":"inStock","validFrom":"2026-09-17T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"These Shining Lives by Melanie Marnich at The Stagecrafters Theater","description":"&lt;p&gt;Four young women meet and forge a bond while working a well-paying job in 1920s rural Illinois, for the Radium Dial Company. Years later, as they realize that the work has compromised their health, they bravely choose to hold the firm accountable. The Stagecrafters Theater 8130 Germantown Ave, Chestnut Hill, Philadelphia PA 19118 \u25cf Friday and Saturday, September 18-19 @ 7:30pm (musical performance before opening night) \u25cf Sunday, September 20 @ 2pm (with a panel discussion \'s only car-free social bike ride, inviting cyclists of all ages and abilities to experience the city from a unique perspective. Philly Bike Ride offers the ultimate &quot;Cruise At Your Own Pace&quot; experience with a 20-mile, car-free route through the heart of the&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/PhillyBikeRide1.png","url":"https://gridphilly.com/event/philly-bike-ride-2026/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T07:30:00-04:00","endDate":"2026-10-17T12:30:00-04:00","offers":{"@type":"Offer","price":"95,","priceCurrency":"USD","url":"https://gridphilly.com/event/philly-bike-ride-2026/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Saturday Planting at Kitchen&#8217;s Lane Bridge","description":"&lt;p&gt;Meeting at Kitchen\u2019s Lane Bridge on Forbidden Drive (view on Google Maps) Parking: There is limited parking at the Kitchens Lane Parking lot, as well as more extensive street parking near the Jannette Street Trailhead. Both of these options are a short hike away from our meeting location, so please plan your arrival time accordingly. If you\u2019re taking public transit, our location is accessible via the 9, 32, and 53 buses. See map for details. Bathrooms:\u00a0The Kitchen\u2019s Lane composting bathroom will be available for use. Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/IMG_0659-scaled-GB0GRi.jpg","url":"https://gridphilly.com/event/saturday-planting-at-kitchens-lane-bridge/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T09:00:00-04:00","endDate":"2026-10-17T12:00:00-04: is included! Recommended for ages 8 and up. Stay after the event to see the farm in full fall splendor \u2013 and don\u2019t miss the scarecrow scavenger hunt!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/Fall-Events-Autumn-Archery-1.png","url":"https://gridphilly.com/event/snipes-farm-fall-events-autumn-archery/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T10:00:00-04:00","endDate":"2026-10-17T12:00:00-04:00","location":{"@type":"Place","name":"Snipes Farm","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"890 W Bridge Street","addressLocality":"Morrisville","addressRegion":"PA","postalCode":"19067","addressCountry":"United States"},"telephone":"(215) 295-1138","sameAs":"https://www.snipesfarm.org/"},"organizer":{"@type":"Person","name":"Snipes Farm and Education Center","description":"","url":"https://snipesfarm.org/","telephone":"(215) 295-1138","email":"t&#117;c&#107;e&#114;&#109;&#64;&#115;&#110;&#105;pesfarm.org","sameAs":"https://snipesfarm.org/"},"offers":{"@type":"Offer","price":"10","priceCurrency":"USD","url":"https://gridphilly.com/event/snipes-farm-fall-events-autumn-archery/","category":"primary","availability":"inStock","validFrom":"2026-08-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"NKCDC Weekend Gardening Club","description":"&lt;p&gt;Join our weekend gardening club! Build your gardening skills, share your knowledge and expertise, meet fellow gardeners and grow together while supporting local gardens and farms!\u00a0 Whether you\u2019re picking up a trowel for the first time or have years of gardening experience, we want you to be part of our garden community! Sign up here: https://m.signupgenius.com/#!/showSignUp/10C054CAEAB2EAAFBC34-65529185-nkcdc?useFullSite=false&lt;/p&gt;\\n","url":"https://gridphilly.co ":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Philadelphia Open Studio Tours","description":"&lt;p&gt;Mark your calendars for October 2026, as The Center for Emerging Visual Artists (CFEVA) proudly presents the Annual Philadelphia Open Studio Tours (POST). This acclaimed event stands as Philadelphia\u2019s premier fall visual arts festival, offering an exclusive behind-the-scenes look into the creative processes of 150+ local artists working in an array of visual media: painting, drawing, ceramics, mixed media, photography, metalworking, and much more. Embark on self-guided tours through artist studios and dynamic workspaces, where you can witness artists at work firsthand. Dive into a diverse array of activities including hands-on workshops, gallery exhibitions, live demonstrations, engaging artist talks, special&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/POST-2026-COVER.jpg","url":"https://gridphilly.com/event/philadelphia-open-studio-tours/2026-10-17/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T12:00:00-04:00","endDate":"2026-10-17T18:00:00-04:00","location":{"@type":"Place","name":"Philadelphia Open Studio Tours","description":"","url":"https://gridphilly.com/venue/philadelphia-open-studio-tours/","address":{"@type":"PostalAddress","streetAddress":"3600 Market Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19104","addressCountry":"United States"},"telephone":"2155467775","sameAs":"https://www.cfeva.org/philaopenstudios"},"organizer":{"@type":"Person","name":"The Center for Emerging Visual Artists (CFEVA)","description":"","url":"","telephone":"","email":"","sameAs":""},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","url":"https://gridphilly.com/event/philadelphia-open-studio-tours/2026-10-17/","category":"primary","availability":"inStock","validFrom":"2026-09-21T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"GOAToberfest 2026","description":"&lt;p&gt;The most fun(d) you will ever have helping to support Philly\\'s best non profit!! Hosted by the Fabulous Queen Dominique Lee!! Lots of free things with your ticket purchase! Mature guests, ages 14 and over! (and hand held babies!) Time &amp; Location Oct 17, 2026, 2:00 PM \u2013 5:00 PM Laurel Hill West Cemetery, 225 Belmont Ave, Bala Cynwyd, PA 19004 About the event The best shenanigans in town are happening on Saturday, October 17th at the Conservatory at Laurel Hill West Cemetery. This event will take place indoors in the event of rain. Have a great time while making&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/GOAToberfest.avif","url":"https://gridphilly.com/event/goatoberfest-2026/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T14:00:00-04:00","endDate":"2026-10-17T17:00:00-04:00","organizer":{"@type":"Person","name":"The Philly Goat Project","description":"","url":"https://www.phillygoatproject.org","telephone":"","email":"","sameAs":"https://www.phillygoatproject.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Discover the Wissahickon: Toleration Trail Hike","description":"&lt;p&gt;Meeting at White Trail Entrance (W Hortter St and Park Line Drive) Our\u00a0Discover the Wissahickon hike series is presented by Newrez. Join Trail Ambassadors Eric Dahlberg, Courtney Malley, Amy Hirsch, and Chris Unander on a hike in the south section of the Park. We\u2019ll pass by the Toleration statue, Kitchen\u2019s Lane Shelter, and Historic RittenhouseTown. This moderately difficult hike has some rocky trails and steep elevation changes. Check out a preview of our hike on Komoot below! Parking and Transit: If you\u2019re driving, there should be plenty of free street parking along Park Line Drive. Remember to never leave valuables&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Toleration-hf142F.jpg","url":"https://gridphilly.com/event/discover-the-wissahickon-toleration-trail-hike/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-17T15:00:00-04:00","endDate":"2026-10-17T17:00:00-04:00","location":{"@type":"Place","name":"corner of Park Line Drive and Hortter Street, Park Line Dr &amp; W Hortter St., Philadelphia, PA, 19119","description":"","url":"https://gridphilly.com/venue/corner-of-park-line-drive-and-hortter-street-park-line-dr-w-hortter-st-philadelphia-pa-19119/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"HARVEST FEST 2026","description":"&lt;p&gt;Join us at The Farm at Awbury for our annual HARVEST FEST CELEBRATION Watch this space as we continue to share details about the event!&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Harvest-Fest-Pumpkin-Illustration-2-9X18gq.png","url":"https://gridphilly.com/event/harvest-fest-2026/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-18T00:00:00-04:00","endDate":"2026-10-18T23:59:59-04:00","location":{"@type":"Place","name":"The Farm at Awbury","description":"","url":"https://gridphilly.com/venue/the-farm-at-awbury/","address":{"@type":"PostalAddress","streetAddress":"6336 Ardleigh Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19138","addressCountry":"United States"},"geo":{"@type":"GeoCoordinates","latitude":40.055741,"longitude":-75.170491},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-18/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-18T00:00:00-04:00","endDate":"2026-10-18T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"&#98;&#101;&#97;&#114;&#100;&#101;dl&#97;&#100;&#105;e&#115;&#99;aba&#114;e&#116;&#64;gmai&#108;&#46;c&#111;m","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-18/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org" 19/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-19T07:00:00-04:00","endDate":"2026-10-19T08:00:00-04:00","location":{"@type":"Place","name":"The Farm at Awbury Arboretum","description":"","url":"https://gridphilly.com/venue/the-farm-at-awbury-arboretum/","address":{"@type":"PostalAddress","streetAddress":"6336 Ardleigh Street","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19138","addressCountry":"United States"},"telephone":"0","sameAs":"awbury.org"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"EKNA General Meeting","description":"&lt;p&gt;East Kensington Neighbors Association meets on the third Monday of every month to relay community news, crime reports, grant proposals and other updates. June and July meetings are held at Circle of Hope, 2007 Frankford Avenue. There is no meeting in August.\u00a0 6:15 PM Doors open 7:00 PM Meeting begins 8:30 PM Meeting adjourns\u00a0 Live streaming is available to EKNA members who are unable to attend. Email\u00a0secretary@ekna.org for residency verification and instructions.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/EKNA-2-37B33a.png","url":"https://gridphilly.com/event/ekna-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-19T19:00:00+00:00","endDate":"2026-10-19T20:30:00+00:00","location":{"@type":"Place","name":"Philadelphia Brewing Company, 2440 Frankford Avenue, Philadelphia, PA, 19125, United States","description":"","url":"https://gridphilly.com/venue/philadelphia-brewing-company-2440-frankford-avenue-philadelphia-pa-19125-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Riverside Bike Ride","description":"&lt;p&gt ion":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Priority Hoarding: A Retrospectacle","description":"&lt;p&gt;\u201cWhere our baggage is yours!\u201d Welcome to the Bearded Ladies\u2019 Hairport, an interactive installation &amp; performance series built on 16-years of accumulated baggage from a queer cabaret company devoted to art, care, mess, and community. While you\u2019re waiting for a flight that may never take off, unpack your baggage and rifle through some of ours. You may recognize something as your own, or find something you never knew you were carrying. Made for anyone who has ever lost a bag, gotten stuck, or missed a (metaphoric) flight, this trans(formational) installation asks: how do you know it\u2019s time to move on&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/08/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-21/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-21T00:00:00-04:00","endDate":"2026-10-21T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"be&#97;r&#100;&#101;&#100;ladie&#115;ca&#98;a&#114;et&#64;&#103;mai&#108;&#46;&#99;&#111;&#109;","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-21/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Valley Talk &#8211; Into the Weeds: Foraging for Invasive Plants in Pennsylvania with Tama Matsuoka Wong, presented by Univest Finanical","description":"&lt;p&gt;In person at the\u00a0Valley Green Inn\u00a0or online on Zoom Many a gardener, flower lover, or backyard farmer hates that most dreaded of garden chores: getting rid of weeds. Tama Matsuoka Wong offers a new approach to many plants deemed undesirable: manage them, turn them into delicious food, teas, structures\u2026.in other words reap their abundance. A self-described \u201cfailed\u201d gardener turned garden contrarian, she looks to cues as to what plants grow wild naturally in situ, and, besides that, sells many pounds of invasive weeds to markets and chefs. On a more personal level, she will share with you the \u201cwhy\u201d of&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/5123444471_9578b275ca_b-15IvG8.jpg","url":"https://gridphilly.com/event/valley-talk-into-the-weeds-foraging-for-invasive-plants-in-pennsylvania-with-tama-matsuoka-wong-presented-by-univest-finanical/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-21T18:00:00-04:00","endDate":"2026-10-21T19:30:00-04:00","location":{"@type":"Place","name":"Valley Green Inn, Valley Green Road, Philadelphia, 19128, United States","description":"","url":"https://gridphilly.com/venue/valley-green-inn-valley-green-road-philadelphia-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"The Power of Participation: Climate Justice &amp; Community Action","description":"&lt;p&gt;Hosted by the Bucks County Beacon and Doylestown Action League Moderated by Connor O\u2019HanlonJoin us for an inspiring evening of conversation and connection as we explore how we can drive meaningful change through climate action, environmental justice, and mutual aid.This panel brings together leaders working at the intersection of science, policy, business, and media to build a more equitable, sustainable future. We\u2019ll discuss how local action can ripple outward to create lasting impact\u2014from reducing carbon emissions to reimagining how we care for one another.If you\u2019ve ever wondered how to get involved, where to start, or how collective participation can strengthen&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/b084a7653e9bc324cba453bf746d8b2c.jpg","url":"https://gridphilly.com/event/the-power-of-participation-climate-justice-community-action/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-21T18:30:00-04:00","endDate":"2026-10-21T20:00:00-04:00","location":{"@type":"Place","name":"10 Doyle St","description":"","url":"https://gridphilly.com/venue/10-doyle-st/","address":{"@type":"PostalAddress","streetAddress":"10 Doyle Street","addressLocality":"Doylestown","addressRegion":"PA","postalCode":"18901","addressCountry":"United States"},"telephone":"","sameAs":""},"organizer":{"@type":"Person","name":"The Bucks County Beacon","description":"","url":"https://buckscountybeacon.com","telephone":"","email":"","sameAs":"https://buckscountybeacon.com"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"FNA General Meeting","description":"&lt;p&gt;Fishtown Neighbors Association aims to connect Fishtown neighbors, preserve Fishtown\u2019s unique character, and honor the community\u2019s shared vision for its future. All Fishtown residents and business owners are welcome\u2014visit fishtown.org for details.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/FNA-3-HrL7bb.png","url":"https://gridphilly.com/event/fna-general-meeting/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-21T19:00:00+00:00","endDate":"2026-10-21T20:30:00+00:00","location":{"@type":"Place","name":"Fishtown Recreation Center, 1202 E Montgomery Avenue, Philadelphia, PA, 19125, United States","description":"","url":"https://gridphilly.com/venue/fishtown-recreation-center-1202-e-montgomery-avenue-philadelphia-pa-19125-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"INTENSIVE SCREENWRITING WORKSHOP","description":"&lt;p&gt;SIFTMedia Collective presents a 4 week Intensive Screenwriting Workshop with Stephanie Malson \u2013 this Workshop is designed to support filmmakers, whether starting with an initial concept or refining a short or feature-length screenplay. Through deep analysis and communal feedback, you\u2019ll see your idea or draft develop into a screenplay.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/03/Intensive-Screenwriting-Workshop_March_2026_Stephanie-Malson.jpg","url":"https://gridphilly.com/event/intensive-screenwriting-workshop/2026-10-21/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-21T19:00:00-04:00","endDate":"2026-10-21T21:00:00-04:00","organizer":{"@type":"Person","name":"SIFTMedia 215","description":"","url":"https://siftmedia215.org/","telephone":"267-463-5198","email":"&#115;&#105;&#102;&#116;&#109;e&#100;&#105;a&#50;1&#53;&#64;gm&#97; 8/PH-for-IG.png","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-23/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-23T00:00:00-04:00","endDate":"2026-10-23T23:59:59-04:00","location":{"@type":"Place","name":"The Hairport","description":"","url":"https://gridphilly.com/venue/the-hairport/","address":{"@type":"PostalAddress","streetAddress":"444 N 3rd Street","addressLocality":"Philadelphia","postalCode":"19123","addressCountry":"United States"},"telephone":"","sameAs":"https://beardedladiescabaret.com/priority-hoarding"},"organizer":{"@type":"Person","name":"The Bearded Ladies Cabaret","description":"","url":"https://beardedladiescabaret.com/","telephone":"","email":"b&#101;ar&#100;edl&#97;&#100;i&#101;&#115;&#99;&#97;b&#97;&#114;&#101;t&#64;&#103;mai&#108;.c&#111;&#109;","sameAs":"https://beardedladiescabaret.com/"},"offers":{"@type":"Offer","price":"Free \u2013 50","priceCurrency":"USD","url":"https://gridphilly.com/event/priority-hoarding-a-retrospectacle/2026-10-23/","category":"primary","availability":"inStock","validFrom":"2026-08-20T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"2026 Cliveden House Tour Season","description":"&lt;p&gt;2026 House Tour Season begins Friday, May 1st The 2026 house tour season begins Friday, May 1, 2026! Tours are available Thursdays through Sundays, 12pm to 4pm, beginning on the hour. The last tour of the day is at 3pm. Each tour is an hour-long experience, led by a Cliveden Interpreter. Tours begin in the Cliveden Barn (located at 98 E. Cliveden Street, 19119) followed by the grounds, first and second floor of the House, and our new exhibit, Procuring Liberty in the Emerging Nation, debuting in 2026. Tours can be scheduled in advance through our website or in person&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/05/Screenshot-2026-05-12-at-2.43.04-PM.png","url":"https://gridphilly.com/event/2026-cliveden-house-tour-season/2026-10-23/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-23T12:00:00-04:00","endDate":"2026-10-23T16:00:00-04:00","location":{"@type":"Place","name":"Cliveden","description":"","url":"https://gridphilly.com/venue/cliveden/","address":{"@type":"PostalAddress","streetAddress":"6401 Germantown Avenue","addressLocality":"Philadelphia","addressRegion":"PA","postalCode":"19144","addressCountry":"United States"},"telephone":"215-848-1777","sameAs":"https://cliveden.org/"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Cure Violence Kensington Friday Drop-In Hours","description":"&lt;p&gt;Our weekly Drop-In Center is a safe, judgment-free space to come as you are. You can grab coffee and food, play games, and connect with people who understand what you\u2019re going through. If you\u2019ve been caught up in street life, recently came home, or just need real support and a place to stay grounded\u2014you belong here. We can connect you to:\u00a0 Housing and utility assistance\u00a0 ID and personal documents\u00a0 Employment opportunities Legal support Food &amp; Clothing Stop by for an intake and see how we can support you and your needs. Contact Cure Violence at 215-427-0350&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Cure-Violence-Drop-in-Flyer-2KioR9.png","url":"https://gridphilly.com/event/cure-violence-kensington-friday-drop-in-hours-5/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-23T14:00:00-04:00","endDate":"2026-10-23T16:00:00-04:00","location":{"@type":"Place","name":"Kensington Engagement Center, 3000 Kensington Avenue, Philadelphia, PA, 19134, United States","description":"","url":"https://gridphilly.com/venue/kensington-engagement-center-3000-kensington-avenue-philadelphia-pa-19134-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"These Shining Lives by Melanie Marnich at The Stagecrafters Theater","description":"&lt;p&gt;Four young women meet and forge a bond while working a well-paying job in 1920s rural Illinois, for the Radium Dial Company. Years later, as they realize that the work has compromised their health, they bravely choose to hold the firm accountable. The Stagecrafters Theater 8130 Germantown Ave, Chestnut Hill, Philadelphia PA 19118 \u25cf Friday and Saturday, September 18-19 @ 7:30pm (musical performance before opening night) \u25cf Sunday, September 20 @ 2pm (with a panel discussion to follow the performance) \u25cf Thursday, Friday and Saturday, September 24-26 @ 7:30pm \u25cf Thursday, Friday and Saturday, October 1-3 @ 7:30pm \u25cf Sunday,&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Shining_postcard.jpg","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-23/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-23T19:30:00-04:00","endDate":"2026-10-23T21:00:00-04:00","location":{"@type":"Place","name":"The Stagecrafters Theater","description":"","url":"https://gridphilly.com/venue/","address":{"@type":"PostalAddress","streetAddress":"8130 Germantown Ave","addressLocality":"Philadelphia","addressRegion":"P","postalCode":"19118","addressCountry":"United States"},"telephone":"2152479913","sameAs":"https://thestagecrafters.org/"},"organizer":{"@type":"Person","name":"The Stagecrafters Theater","description":"","url":"https://www.thestagecrafters.org","telephone":"2152479913","email":"&#106;t&#111;c&#122;&#101;k&#64;t&#104;e&#115;tag&#101;&#99;r&#97;f&#116;&#101;r&#115;&#46;org","sameAs":"https://www.thestagecrafters.org"},"offers":{"@type":"Offer","price":"26 \u2013 30","priceCurrency":"USD","url":"https://gridphilly.com/event/these-shining-lives-by-melanie-marnich-at-the-stagecrafters-theater/2026-10-23/","category":"primary","availability":"inStock","validFrom":"2026-09-07T00:00:00+00:00"},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Saturday Planting on the Yellow Trail","description":"&lt;p&gt;Meeting at Wigard Avenue Trailhead\u00a0(726 Wigard Avenue) Parking: If you\u2019re driving, there\u2019s plenty of space to park onsite.\u00a0Reminder\u00a0to never leave valuables behind in your car! If you\u2019re taking public transit, our location is serviced by the 9 and 27 buses, although it\u2019s a 10-minute walk from the 9 bus stop. See map for details. Bathrooms:\u00a0There will not be restrooms available during the service day. Would you like to be part of keeping Wissahickon Valley Park beautiful and sustainable? Then join us in the park for a native planting on our Yellow Trail reroute! All are welcome to attend, and no&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/YEE_0359-20211016-jpg-bw5Fhw.webp","url":"https://gridphilly.com/event/saturday-planting-on-the-yellow-trail/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-24T09:00:00-04:00","endDate":"2026-10-24T12:00:00-04:00","location":{"@type":"Place","name":"Wigard Avenue Trailhead, 726 Wigard Avenue, Philadelphia, PA, 19128, United States","description":"","url":"https://gridphilly.com/venue/wigard-avenue-trailhead-726-wigard-avenue-philadelphia-pa-19128-united-states/","address":{"@type":"PostalAddress"},"telephone":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Stewardship Saturdays at John Heinz \u2013 Volunteers Needed!","description":"&lt;p&gt;Stewardship Saturdays are open events that welcomes all visitors to take part in a hands on experience of creating better habitats for wildlife on the Refuge. Folks will meet at the Visitor\\'s Center where they will meet and then work with experienced &quot;Weed Warriors&quot; who will teach them about removing invasive plants and or planting native plants to improve native plant diversity and/or food sources for wildlife.&lt;/p&gt;\\n","image":"https://gridphilly.com/wp-content/uploads/2026/09/Screenshot-2026-09-21-at-2.49.30-PM.png","url":"https://gridphilly.com/event/stewardship-saturdays-at-john-heinz-volunteers-needed/2026-10-24/","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","startDate":"2026-10-24T09:00:00-04:00","endDate":"2026-10-24T12:00:00-04:00","location":{"@type":"Place","name":"John Heinz National Wildlife Refuge","description":"","url":"https://gridphilly.com/venue/john-heinz-national-wildlife-refuge/","address":{"@type":"PostalAddress","streetAddress":"8601 Lindbergh Blvd","addressLocality":"Philadelphia","postalCode":"19153"},"telephone":"","sameAs":"https://natlands.org/venue/john-heinz-national-wildlife-refuge/"},"organizer":{"@type":"Person","name":"John Heinz Wildlife","description":"","url":"","telephone":"","email":"","sameAs":""},"performer":"Organization"},{"@context":"http://schema.org","@type":"Event","name":"Pennsylvania Chocolate and Coffee Festival","description":"&lt;p&gt;Sip, Sample, and Shop! Indulge your senses at the Pennsylvania Chocolate and Coffee Festival. The premier gathering for coffee lovers, chocolate enthusiasts, and local craft supporters. Join us at the Greater Philadelphia Expo Center for a weekend showcasing a curated selection of craft chocolate and specialty coffee available for you to sample and savor. Explore over 150 vendors, meet our festival mascots Chunk and Bean, engage in interactive seminars and demos, and enjoy a family-friendly atmosphere design
